    Meta: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [ code, message, details ]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: [ string, "null" ] }
        correlation_id: { type: [ string, "null" ] }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: [ object, "null" ], additionalProperties: false }
        meta: { $ref: "#/components/schemas/Meta" }
        errors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiError" }
    SuccessEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/Meta" }
        errors: { type: array, maxItems: 0 }
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ status, service, timestamp ]
              properties:
                status: { type: string, const: ok }
                service: { type: string, const: materyalph-api }
                timestamp: { type: string, format: date-time }
    Agreement:
      type: object
      required: [ id, code, title, audience, version, content_uri, effective_at ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        audience: { type: string }
        version: { type: integer, minimum: 1 }
        content_uri: { type: string }
        effective_at: { type: string, format: date-time }
    AgreementListEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Agreement" } }
    CsrfEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ csrf_token ]
              properties: { csrf_token: { type: string } }
    AccountType: { type: string, enum: [ BUYER, VENDOR, ADMIN ] }
    EmailRequest:
      type: object
      required: [ email ]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    RegisterRequest:
      type: object
      description: Vendor web registration. The WEB transport is selected by the server route.
      required:
        [
          full_name,
          email,
          mobile_e164,
          password,
          password_confirmation,
          business_name,
          terms_accepted,
          privacy_accepted
        ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        business_name: { type: string, maxLength: 180 }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor checkbox or accessible email fallback evidence.
    BuyerMobileRegisterRequest:
      type: object
      description: Buyer-native registration. The BUYER/MOBILE transport is selected by the server route and contains no
        CAPTCHA evidence.
      required: [ full_name, email, mobile_e164, password, password_confirmation, buyer_type, terms_accepted, privacy_accepted ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        buyer_type: { type: string, maxLength: 32 }
        company_name: { type: [ string, "null" ], maxLength: 180 }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VerifyEmailRequest:
      type: object
      required: [ email, code ]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
    LoginRequest:
      type: object
      description: Vendor/Admin browser login. The WEB transport is selected by the server route.
      required: [ email, password, portal ]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        portal: { type: string, enum: [ VENDOR, ADMIN ] }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor web password login only; prohibited for Admin login.
    BuyerMobileLoginRequest:
      type: object
      description: Buyer-native login. The BUYER/MOBILE transport is selected by the server route and contains no CAPTCHA evidence.
      required: [ email, password ]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_id: { type: [ string, "null" ], format: uuid }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VendorBotProtectionEvidence:
      type: object
      description: >-
        Vendor web only. Supply a checkbox token or explicitly request the accessible email fallback. After successful
        email risk verification, an empty object is permitted because the one-time proof is carried in the HttpOnly
        mp_bot_proof cookie.
      properties:
        recaptcha_token: { type: string, maxLength: 8192, writeOnly: true }
        request_email_step_up:
          type: boolean
          not: { const: false }
          description: Must be true when the accessible email step-up method is selected.
      oneOf:
        - required: [ recaptcha_token ]
        - required: [ request_email_step_up ]
        - maxProperties: 0
    PasswordRecoveryRequest:
      type: object
      description: Vendor/Admin browser password recovery. The WEB transport is selected by the server route.
      required: [ email, portal ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        portal: { type: string, enum: [ VENDOR, ADMIN ] }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor web password recovery only; prohibited for Admin recovery.
    BuyerMobilePasswordRecoveryRequest:
      type: object
      description: Buyer-native password recovery. The BUYER/MOBILE transport is selected by the server route and contains no
        CAPTCHA evidence.
      required: [ email ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VerifyBotChallengeRequest:
      type: object
      required: [ email, code ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^\d{6}$' }
    ResendBotChallengeRequest:
      type: object
      required: [ email ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    BotProofEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ verified, expires_in ]
              properties:
                verified: { type: boolean, const: true }
                expires_in: { type: integer, minimum: 1 }
                step_up_token: { type: string, writeOnly: true }
    BotStepUpErrorEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: [ object, "null" ] }
        meta: { type: object, additionalProperties: true }
        errors:
          type: array
          minItems: 1
          maxItems: 1
          items:
            title: BotStepUpErrorEnvelope_allOf_errors
            type: object
            required: [ code, message, details ]
            properties:
              code: { type: string, enum: [ BOT_STEP_UP_REQUIRED ] }
              message: { type: string }
              details:
                title: BotStepUpErrorEnvelope_allOf_errors_allOf_details
                type: object
                required: [ challenge_id, expires_at, resend_after_seconds ]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  resend_after_seconds: { type: integer, minimum: 0 }
