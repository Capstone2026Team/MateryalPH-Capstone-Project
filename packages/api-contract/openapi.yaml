        "403": { $ref: "#/components/responses/ErrorResponse" }
  /buyers/explore/summary:
    post:
      operationId: getBuyerExploreSummary
      description: >-
        MAT-01/MAT-02 Explore dashboard. Nearby Verified Vendors and Available Products (counted as distinct Vendor listings,
        never variants or canonical materials) and every category count come from one server snapshot with one current_as_of,
        scoped to all categories at the selected location and radius before any category or search filter. Materials Analytics
        stays explicitly unavailable until its end-to-end feature is installed. The origin travels in the body and is never echoed.
      tags: [ Buyer Explore ]
      security: [ { passportBearer: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BuyerOriginRequest" } } }
      responses:
        "200": { description: Explore dashboard snapshot., content: { application/json: { schema: { $ref: "#/components/schemas/ExploreSummaryEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /buyers/listings/search:
    post:
      operationId: searchBuyerListings
      description: >-
        Item-Based search over MAT-02 eligible Tier 2 listings inside the radius; Directory Suppliers are never inventory.
        Browsing defaults to DISTANCE and a text query defaults to BEST_DEAL (SRS, a normalized weighted sum with the Buyer's
        Item-Based weights). FAVORITES_FIRST is a separate explicit sort that never changes Best Deal. Best Price compares the
        MAT-03 normalized price of the same comparable group and canonical unit across in-stock offers in the radius and needs
        two Vendors. One card per listing, deterministic tie-breaking and a signed keyset cursor that rejects changed filters.
      tags: [ Buyer Explore ]
      security: [ { passportBearer: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ListingSearchRequest" } } }
      responses:
        "200": { description: Ranked listing cards., content: { application/json: { schema: { $ref: "#/components/schemas/ListingSearchEnvelope" } } } }
