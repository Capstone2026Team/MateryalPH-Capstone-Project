        flagged_at: { type: [ string, 'null' ], format: date-time }
    OrderNrpc:
      type: object
      required: [ id, amount_centavos, reason, eligible_subtotal_centavos, snapshot_version, proposed_at, affected_lines, terms, cancellation_effect, status, accepted_at, flag ]
      properties:
        id: { type: string, format: uuid }
        amount_centavos: { type: integer, format: int64 }
        reason: { type: string }
        eligible_subtotal_centavos: { type: [ integer, 'null' ], format: int64 }
        snapshot_version: { type: integer }
        proposed_at: { type: [ string, 'null' ], format: date-time }
        affected_lines: { type: array, items: { $ref: "#/components/schemas/NrpcAffectedLine" } }
        terms: { oneOf: [ { $ref: "#/components/schemas/NrpcTermsVersion" }, { type: 'null' } ] }
        cancellation_effect: { type: string }
        status: { type: string, enum: [ PROPOSED, ACCEPTED, REJECTED ] }
        accepted_at: { type: [ string, 'null' ], format: date-time }
        flag: { oneOf: [ { $ref: "#/components/schemas/NrpcFlag" }, { type: 'null' } ] }
    OrderTimelineEvent:
