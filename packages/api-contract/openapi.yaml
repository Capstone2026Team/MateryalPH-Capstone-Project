        listing_variant_id: { type: string, format: uuid }
        expected_price_version_id: { type: string, format: uuid, description: The price version shown to the Buyer; a newer one returns 409 PRICE_CHANGED. }
        quantity: { type: string, pattern: '^\d{1,7}(\.\d{1,4})?$' }
        fulfillment_method: { type: [ string, 'null' ], enum: [ DELIVERY, PICKUP, null ] }
        location_id: { type: [ string, 'null' ], format: uuid }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        origin_source: { type: string, enum: [ DEVICE, MAP_PIN, SEARCH ] }
        radius_km: { type: integer }
    CartItemUpdate:
      type: object
      additionalProperties: false
      required: [ lock_version ]
      properties:
        lock_version: { type: integer, minimum: 1 }
        quantity: { type: string, pattern: '^\d{1,7}(\.\d{1,4})?$' }
        saved_for_later: { type: boolean }
        accept_current_price: { type: boolean }
    CartFulfillmentUpdate:
      type: object
      additionalProperties: false
      required: [ lock_version, fulfillment_method ]
      properties:
        lock_version: { type: integer, minimum: 1 }
        fulfillment_method: { type: string, enum: [ DELIVERY, PICKUP ] }
    CartDestinationUpdate:
      type: object
      additionalProperties: false
      required: [ lock_version, intended_location_id, heavy_vehicle_restriction ]
      properties:
        lock_version: { type: integer, minimum: 1 }
        intended_location_id: { type: [ string, 'null' ], format: uuid }
        heavy_vehicle_restriction: { type: string, enum: [ UNANSWERED, 'NO', 'YES' ] }
        alternate_drop_off_location_id: { type: [ string, 'null' ], format: uuid }
        access_instructions: { type: [ string, 'null' ], maxLength: 500 }
    CheckoutPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        request_version: { type: [ string, 'null' ], pattern: '^[A-Za-z0-9_.:-]{1,64}$', description: Echoed so the client discards stale previews. }
    DeliveryRoute:
      type: object
      required: [ distance_meters, duration_seconds, basis, source, computed_at, cached ]
      properties:
        distance_meters: { type: integer, minimum: 0 }
        duration_seconds: { type: integer, minimum: 0 }
        basis: { type: string, enum: [ ROAD_ROUTE_STORE_TO_VEHICLE_DROP_OFF ] }
        source: { type: string, enum: [ GOOGLE_ROUTES ] }
        computed_at: { type: string, format: date-time }
        cached: { type: boolean }
    DeliveryEstimateOption:
      type: object
      required: [ load_key, vehicle_name, vehicle_type, vehicles, trips, fee_centavos, fee_per_trip_centavos ]
      properties:
        load_key: { type: string }
        vehicle_name: { type: string }
        vehicle_type: { type: string }
        vehicles: { type: integer, minimum: 1 }
        trips: { type: integer, minimum: 1 }
        fee_centavos: { type: integer, minimum: 0 }
        fee_per_trip_centavos: { type: integer, minimum: 0 }
    DeliveryEstimate:
      description: Advisory range across the Vendor's eligible vehicles. Not an offer; the Vendor confirms vehicles, trips and the final fee.
      type: object
      required: [ fee_min_centavos, fee_max_centavos, trips_min, trips_max, vehicles_min, vehicles_max, options ]
      properties:
        fee_min_centavos: { type: integer, minimum: 0 }
        fee_max_centavos: { type: integer, minimum: 0 }
        trips_min: { type: integer, minimum: 0 }
        trips_max: { type: integer, minimum: 0 }
        vehicles_min: { type: integer, minimum: 0 }
        vehicles_max: { type: integer, minimum: 0 }
        options: { type: array, items: { $ref: "#/components/schemas/DeliveryEstimateOption" } }
    DeliveryPreview:
      type: object
      required: [ status, issues, endpoint, route, straight_line_meters, coverage_km, estimate, manual_review_reasons, confirmed_offer, calculation_version, notice ]
      properties:
        status: { type: string, enum: [ NOT_APPLICABLE, ACTION_REQUIRED, BLOCKED, MANUAL_REVIEW, ADVISORY_ESTIMATE ] }
        issues: { type: array, items: { $ref: "#/components/schemas/CartIssue" } }
        endpoint: { type: [ string, 'null' ], enum: [ INTENDED_LOCATION, ALTERNATE_DROP_OFF, null ] }
        route: { oneOf: [ { $ref: "#/components/schemas/DeliveryRoute" }, { type: 'null' } ] }
        straight_line_meters: { type: [ integer, 'null' ] }
        coverage_km: { type: [ integer, 'null' ] }
        estimate: { oneOf: [ { $ref: "#/components/schemas/DeliveryEstimate" }, { type: 'null' } ] }
        manual_review_reasons: { type: array, items: { type: string } }
        confirmed_offer: { type: [ object, 'null' ], additionalProperties: true, description: Always null in a preview; an authorized confirmed offer exists only after Vendor confirmation. }
        calculation_version: { type: string }
        notice: { type: [ string, 'null' ] }
    PickupPreview:
      type: object
      required: [ address, open_status, notice ]
      properties:
        address: { oneOf: [ { $ref: "#/components/schemas/PublicAddressSummary" }, { type: 'null' } ] }
        open_status: { oneOf: [ { $ref: "#/components/schemas/SupplierOpenStatus" }, { type: 'null' } ] }
        notice: { type: string }
    PaymentMethodEligibility:
      type: object
      required: [ method, available, reason ]
      properties:
        method: { type: string, enum: [ ONLINE, CASH_ON_DELIVERY, IN_STORE ] }
        available: { type: boolean }
        reason: { type: [ string, 'null' ] }
    DeliveryAmount:
      type: object
      required: [ status, min_centavos, max_centavos ]
      properties:
        status: { type: string, enum: [ ESTIMATE, NOT_APPLICABLE, PENDING_VENDOR_REVIEW ] }
        min_centavos: { type: [ integer, 'null' ] }
        max_centavos: { type: [ integer, 'null' ] }
    ProcessingFeeAmount:
      type: object
      required: [ status, amount_centavos ]
      properties:
        status: { type: string, enum: [ PENDING_PAYMENT_CHANNEL ] }
        amount_centavos: { type: [ integer, 'null' ] }
    FinancialPreviewLine:
      type: object
      required: [ line_id, payable_centavos, included_vat_centavos, tax_category ]
      properties:
        line_id: { type: string, format: uuid }
        payable_centavos: { type: integer, minimum: 0 }
        included_vat_centavos: { type: integer, minimum: 0 }
        tax_category: { type: string, enum: [ VAT_12, VAT_ZERO, VAT_EXEMPT, NON_VAT ] }
    FinancialPreview:
      description: FIN-02 preview. M = Σ line payable amounts, V = included VAT, E = M − V; D estimate or pending; F pending until a payment channel. Never includes Vendor commission or merchant withholding.
      type: object
      required: [ currency, calculation_version, lines, materials_subtotal_centavos, included_vat_centavos, vat_exclusive_materials_centavos, vat_treatment, delivery, processing_fee, total_before_processing_min_centavos, total_before_processing_max_centavos, excludes, status ]
      properties:
        currency: { type: string, const: PHP }
        calculation_version: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/FinancialPreviewLine" } }
        materials_subtotal_centavos: { type: integer, minimum: 0 }
        included_vat_centavos: { type: integer, minimum: 0 }
        vat_exclusive_materials_centavos: { type: integer, minimum: 0 }
        vat_treatment: { type: string, enum: [ PRICES_INCLUDE_VAT, NO_INCLUDED_VAT ] }
        delivery: { $ref: "#/components/schemas/DeliveryAmount" }
        processing_fee: { $ref: "#/components/schemas/ProcessingFeeAmount" }
        total_before_processing_min_centavos: { type: [ integer, 'null' ] }
        total_before_processing_max_centavos: { type: [ integer, 'null' ] }
        excludes: { type: array, items: { type: string, enum: [ VENDOR_COMMISSION, MERCHANT_WITHHOLDING ] } }
        status: { type: string, enum: [ ADVISORY_UNTIL_VENDOR_CONFIRMATION ] }
    CheckoutVendorRef:
      type: object
      required: [ id, name, logo_url, address, open_status ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logo_url: { type: [ string, 'null' ], format: uri }
        address: { oneOf: [ { $ref: "#/components/schemas/PublicAddressSummary" }, { type: 'null' } ] }
        open_status: { oneOf: [ { $ref: "#/components/schemas/SupplierOpenStatus" }, { type: 'null' } ] }
    CheckoutGroupPreview:
      type: object
      required: [ vendor, fulfillment_method, fulfillment_options, status, issues, lines, delivery, pickup, payment_methods, amounts ]
      properties:
        vendor: { $ref: "#/components/schemas/CheckoutVendorRef" }
        fulfillment_method: { type: [ string, 'null' ], enum: [ DELIVERY, PICKUP, null ] }
        fulfillment_options: { type: array, items: { type: string, enum: [ DELIVERY, PICKUP ] } }
        status: { type: string, enum: [ READY, ACTION_REQUIRED, BLOCKED ] }
        issues: { type: array, items: { $ref: "#/components/schemas/CartIssue" } }
        lines: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
        delivery: { $ref: "#/components/schemas/DeliveryPreview" }
        pickup: { oneOf: [ { $ref: "#/components/schemas/PickupPreview" }, { type: 'null' } ] }
        payment_methods: { type: array, items: { $ref: "#/components/schemas/PaymentMethodEligibility" } }
        amounts: { $ref: "#/components/schemas/FinancialPreview" }
    CheckoutPreviewSummary:
      type: object
      required: [ group_count, ready_groups, action_required_groups, blocked_groups, requires_split_confirmation, creates_orders, reserves_stock, notice ]
      properties:
        group_count: { type: integer, minimum: 0 }
        ready_groups: { type: integer, minimum: 0 }
        action_required_groups: { type: integer, minimum: 0 }
        blocked_groups: { type: integer, minimum: 0 }
        requires_split_confirmation: { type: boolean }
        creates_orders: { type: boolean, const: false }
        reserves_stock: { type: boolean, const: false }
        notice: { type: string }
    CheckoutPreview:
      type: object
      required: [ request_version, cart_lock_version, current_as_of, calculation_version, destination, groups, summary ]
      properties:
        request_version: { type: [ string, 'null' ] }
        cart_lock_version: { type: integer, minimum: 1 }
        current_as_of: { type: string, format: date-time }
        calculation_version: { type: string }
        destination: { $ref: "#/components/schemas/CartDestination" }
        groups: { type: array, items: { $ref: "#/components/schemas/CheckoutGroupPreview" } }
        summary: { $ref: "#/components/schemas/CheckoutPreviewSummary" }
    CheckoutPreviewEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { $ref: "#/components/schemas/CheckoutPreview" }
        meta: { type: object, additionalProperties: true }
        errors: { type: array, items: { type: object, additionalProperties: true } }
    StoreHoursDay:
      type: object
      required: [ date, day_of_week, weekday, status, opens_at, closes_at, source ]
      properties:
        date: { type: string, format: date, description: Asia/Manila calendar date. }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        weekday: { type: string }
        status: { type: string, enum: [ OPEN, CLOSED ] }
        opens_at: { type: [ string, 'null' ], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        closes_at: { type: [ string, 'null' ], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: The closing minute itself is closed. }
        source: { type: string, enum: [ WEEKLY, DATE_OVERRIDE ] }
    StoreNextOpening:
      type: object
      required: [ date, weekday, opens_at ]
      properties:
        date: { type: string, format: date }
        weekday: { type: string }
        opens_at: { type: string }
    StoreOpenNow:
      description: Informational label from the saved schedule and server time in Asia/Manila; not staff presence, stock or a response promise.
      type: object
      required: [ status, closes_at, next_opening, basis ]
      properties:
        status: { type: string, enum: [ OPEN, CLOSED, UNAVAILABLE ] }
        closes_at: { type: [ string, 'null' ] }
        next_opening: { oneOf: [ { $ref: "#/components/schemas/StoreNextOpening" }, { type: 'null' } ] }
        basis: { type: string, enum: [ SAVED_SCHEDULE, DATE_OVERRIDE ] }
    RadiusKm:
      description: Approved Buyer/Vendor radius allowlist; 5 km is the Buyer default and 50 km the platform maximum.
      type: integer
      enum: [ 5, 10, 20, 30, 40, 50 ]
    SupplierTier:
      type: string
      enum: [ VERIFIED_VENDOR, DIRECTORY_SUPPLIER ]
    ScoreLabel:
      description: Tier 2 shows VPS or New Vendor; Tier 1 shows Directory. A Google rating is never a ScoreLabel.
      type: object
      required: [ kind, value, text ]
      properties:
        kind: { type: string, enum: [ VPS, NEW_VENDOR, DIRECTORY ] }
        value: { type: [ string, 'null' ], description: One-decimal VPS for kind VPS; null otherwise. }
        text: { type: string }
    MapPoint:
      type: object
      required: [ latitude, longitude ]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    PublicAddressSummary:
      type: object
      required: [ formatted_address, city_municipality, province ]
      properties:
        formatted_address: { type: [ string, 'null' ] }
        city_municipality: { type: [ string, 'null' ] }
        province: { type: [ string, 'null' ] }
    SupplierOpenStatus:
      description: Descriptive only. Derived from saved public hours in Asia/Manila; never filters, ranks or implies stock or staff presence.
      type: object
      required: [ status, opens_at, closes_at, basis ]
      properties:
        status: { type: string, enum: [ OPEN, CLOSED, UNAVAILABLE ] }
        opens_at: { type: [ string, 'null' ] }
        closes_at: { type: [ string, 'null' ] }
        basis: { type: string, enum: [ SAVED_SCHEDULE, DATE_OVERRIDE ] }
    SupplierServiceability:
      description: Advisory straight-line comparison with the Vendor's stated delivery distance; actual serviceability is revalidated at checkout.
      type: object
      required: [ pickup_available, delivery, delivery_maximum_km, basis ]
      properties:
        pickup_available: { type: boolean }
        delivery: { type: string, enum: [ WITHIN_STATED_AREA, OUTSIDE_STATED_AREA, NOT_OFFERED ] }
        delivery_maximum_km: { type: [ integer, 'null' ] }
        basis: { type: string, enum: [ STRAIGHT_LINE_ADVISORY ] }
    VerifiedVendorSummary:
      type: object
      required: [ logo_url, supplier_type, niches, fulfillment_method, vacation_mode, public_phone, address, open_status, serviceability ]
      properties:
        logo_url: { type: [ string, 'null' ], format: uri }
        supplier_type: { type: [ string, 'null' ] }
        niches: { type: array, items: { type: string } }
        fulfillment_method: { type: [ string, 'null' ] }
        vacation_mode: { type: boolean }
        public_phone: { type: [ string, 'null' ] }
        address: { $ref: "#/components/schemas/PublicAddressSummary" }
        open_status: { $ref: "#/components/schemas/SupplierOpenStatus" }
        serviceability: { $ref: "#/components/schemas/SupplierServiceability" }
    DirectorySupplierSummary:
      type: object
      required: [ formatted_address, primary_type, source, refreshed_at ]
      properties:
        formatted_address: { type: [ string, 'null' ] }
        primary_type: { type: [ string, 'null' ] }
        source: { type: string, enum: [ GOOGLE ] }
        refreshed_at: { type: string, format: date-time }
    SupplierResult:
      type: object
      required: [ result_id, tier, tier_label, rank, name, marker, distance_meters, score_label, is_favorite, vendor, directory ]
      properties:
        result_id: { type: string, format: uuid }
        tier: { $ref: "#/components/schemas/SupplierTier" }
        tier_label: { type: string }
        rank: { type: integer, minimum: 1 }
        name: { type: string, description: Canonical Public Store Name for Tier 2; Google display name for Tier 1. }
        marker: { $ref: "#/components/schemas/MapPoint" }
        distance_meters: { type: integer, minimum: 0, description: Geodesic straight-line distance; never a route distance. }
        score_label: { $ref: "#/components/schemas/ScoreLabel" }
        is_favorite: { type: boolean }
        vendor: { oneOf: [ { $ref: "#/components/schemas/VerifiedVendorSummary" }, { type: 'null' } ] }
        directory: { oneOf: [ { $ref: "#/components/schemas/DirectorySupplierSummary" }, { type: 'null' } ] }
    DiscoveryScope:
      description: Resolved MAT-01 scope. Never includes the exact origin coordinates; origin_version is an opaque identity for stale-response checks.
      type: object
      required: [ audience, kind, origin_kind, origin_version, radius_km, radius_meters, distance_basis ]
      properties:
        audience: { type: string, enum: [ BUYER ] }
        kind: { type: string, enum: [ RADIUS ] }
        origin_kind: { type: string, enum: [ SAVED_LOCATION, DEVICE, MAP_PIN, SEARCH ] }
        location_id: { type: string, format: uuid }
        origin_label: { type: string }
        origin_version: { type: string, pattern: '^[a-f0-9]{32}$' }
        radius_km: { $ref: "#/components/schemas/RadiusKm" }
        radius_meters: { type: integer }
        distance_basis: { type: string, enum: [ GEODESIC_STRAIGHT_LINE ] }
    DiscoveryCounts:
      type: object
      required: [ verified_vendors, directory_suppliers, favorite_suppliers ]
      properties:
        verified_vendors: { type: integer, minimum: 0 }
        directory_suppliers: { type: integer, minimum: 0 }
        favorite_suppliers: { type: integer, minimum: 0 }
    ProviderAttribution:
      type: object
      required: [ provider, text ]
      properties:
        provider: { type: string, enum: [ GOOGLE ] }
        text: { type: string }
    DirectoryAvailability:
      type: object
      required: [ status, as_of, attribution, coverage_note ]
      properties:
        status: { type: string, enum: [ AVAILABLE, CACHED, UNAVAILABLE, NOT_CONFIGURED, FILTERED_OUT, HIDDEN ] }
        as_of: { type: [ string, 'null' ], format: date-time }
        attribution: { $ref: "#/components/schemas/ProviderAttribution" }
        coverage_note: { type: string }
    RadiusExpansion:
      description: A suggestion only. The next radius is never applied without Buyer confirmation; 50 km has no further expansion.
      type: object
      required: [ eligible_verified_count, suggested_radius_km, at_maximum, reason, requires_confirmation ]
      properties:
        eligible_verified_count: { type: integer, minimum: 0 }
        suggested_radius_km: { type: [ integer, 'null' ], description: 'The next allowed radius (10, 20, 30, 40 or 50), or null at 50 km or with three or more Verified Vendors.' }
        at_maximum: { type: boolean }
        reason: { type: [ string, 'null' ], description: 'FEWER_THAN_THREE_VERIFIED_VENDORS or null.' }
        requires_confirmation: { type: boolean, description: Always true; clients ask before changing the radius. }
    DiscoverySearchMeta:
      type: object
      required: [ scope, current_as_of, eligibility_version, projection_version, counts, directory, expansion, page, per_page, total, has_more ]
      properties:
        correlation_id: { type: string }
        scope: { $ref: "#/components/schemas/DiscoveryScope" }
        current_as_of: { type: string, format: date-time }
        eligibility_version: { type: string }
        projection_version: { type: string }
        counts: { $ref: "#/components/schemas/DiscoveryCounts" }
        directory: { $ref: "#/components/schemas/DirectoryAvailability" }
        expansion: { $ref: "#/components/schemas/RadiusExpansion" }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    DiscoverySearchRequest:
      description: Send location_id or latitude/longitude (never both). Omit both to use the primary saved location. radius_km defaults to the saved preference.
      type: object
      additionalProperties: false
      properties:
        location_id: { type: [ string, 'null' ], format: uuid }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        origin_source: { type: string, enum: [ DEVICE, MAP_PIN, SEARCH ] }
        radius_km: { type: integer, description: 'Must be one of 5, 10, 20, 30, 40 or 50; otherwise 422 RADIUS_UNSUPPORTED.' }
        include_verified: { type: boolean }
        include_directory: { type: boolean }
        favorites_only: { type: boolean }
        supplier_type: { type: [ string, 'null' ], description: 'WHOLESALER_DISTRIBUTOR, RETAIL_HARDWARE_STORE, SPECIALIZED_SUPPLIER or OTHER. Tier-specific filters hide Directory Suppliers.' }
        category_id: { type: [ string, 'null' ], format: uuid }
        page: { type: integer, minimum: 1, maximum: 50 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
    DiscoverySearchEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SupplierResult" } }
        meta: { $ref: "#/components/schemas/DiscoverySearchMeta" }
        errors: { type: array, items: { type: object, additionalProperties: true } }
    GoogleRating:
