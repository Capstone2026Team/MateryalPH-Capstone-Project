        FIN-02 Buyer amounts in integer centavos. Prices include any Vendor VAT; E = M − V. Online pays M + D + F; COD/In-Store
        without NRPC pays M + D directly; with NRPC pays N + F online and M + D − N directly. Vendor commission and merchant
        withholding are never Buyer charges.
      required: [ currency, calculation_version, status, materials_gross_centavos, vendor_discount_centavos, materials_subtotal_centavos, included_vat_centavos, vat_exclusive_centavos, vat_treatment, delivery, nrpc, processing_fee, commercial_total_centavos, amount_due_online_centavos, online_principal_centavos, physical_balance_centavos, payment_purpose, excludes ]
      properties:
        currency: { type: string, const: PHP }
        calculation_version: { type: string }
        status: { type: string, enum: [ ADVISORY_UNTIL_VENDOR_CONFIRMATION, AWAITING_BUYER_ACCEPTANCE, ACCEPTED ] }
        materials_gross_centavos: { type: integer, format: int64 }
        vendor_discount_centavos: { type: integer, format: int64 }
        materials_subtotal_centavos: { type: integer, format: int64 }
        included_vat_centavos: { type: integer, format: int64 }
        vat_exclusive_centavos: { type: integer, format: int64 }
        vat_treatment: { type: string, enum: [ PRICES_INCLUDE_VAT, NO_INCLUDED_VAT ] }
        delivery: { $ref: "#/components/schemas/MoneyDelivery" }
        nrpc: { $ref: "#/components/schemas/MoneyNrpc" }
        processing_fee: { $ref: "#/components/schemas/ProcessingFee" }
        commercial_total_centavos: { type: [ integer, 'null' ], format: int64 }
        amount_due_online_centavos: { type: [ integer, 'null' ], format: int64 }
        online_principal_centavos: { type: [ integer, 'null' ], format: int64 }
        physical_balance_centavos: { type: [ integer, 'null' ], format: int64 }
        payment_purpose: { type: [ string, 'null' ], enum: [ FULL_ORDER_PAYMENT, NRPC_ASSURANCE_PAYMENT, null ] }
        excludes: { type: array, items: { type: string, enum: [ VENDOR_COMMISSION, MERCHANT_WITHHOLDING ] } }
    NrpcAffectedLine:
      type: object
      required: [ order_line_id, label, principal_centavos, line_payable_centavos, included_vat_centavos ]
