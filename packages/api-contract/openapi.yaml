openapi: 3.1.0
info:
  title: MateryalPH API
  version: 1.0.0-phase.11
  description: >-
    Versioned Phase 1–4 contract. Vendor onboarding, verification, activation readiness, private evidence, team invitations, the Vendor catalog and product PS/ICC compliance are server-authorized.
    Browser credentials are isolated by configured frontend origin using _vendor and _admin suffixes on access, refresh, CSRF, MFA and bot-proof cookies.
    Existing unsuffixed browser sessions require sign-in again; cookie selection never replaces account authorization. Native Buyer transport is unchanged.
servers:
  - url: /api/v1
tags:
  - name: Payment Webhooks
  - name: Admin Finance
  - name: Vendor Finance
  - name: Buyer Payments
  - name: System
  - name: Agreements
  - name: Authentication
  - name: Vendor Onboarding
  - name: Stores
  - name: Admin Vendor Verification
  - name: Vendor Catalog
  - name: Admin Product Compliance
  - name: Vendor Inventory
  - name: Vendor Auto-Accept
  - name: Vendor Fleet
  - name: Buyer Locations
  - name: Buyer Discovery
  - name: Buyer Explore
  - name: Buyer Cart
  - name: Buyer Orders
  - name: Vendor Orders
paths:
  /{messagingPortal}/conversations:
    get:
      tags:
        - Messaging
      operationId: listConversations
      description: Current purpose, participant, account and fixed-role authority are
        checked server-side. Vendor uses HttpOnly cookies and CSRF; Buyer uses
        native bearer transport.
      security:
        - passportBearer: []
        - accessCookie: []
          webCsrf: []
      parameters:
        - name: messagingPortal
          in: path
          required: true
          schema:
            type: string
            enum:
              - buyers
              - vendor
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPageResponse"
        "401":
          description: Authentication required
        "403":
          description: Current role or channel access denied
        "404":
          description: Conversation unavailable or access revoked
        "409":
          description: Recoverable version, deadline, idempotency or stock conflict;
            re-read the current version
        "422":
          description: Invalid fields or undisclosed NRPC
        "503":
          description: Provider or scanner unavailable; retry safely
    post:
      tags:
        - Messaging
      operationId: createConversation
      description: Buyer-only Item-Based inquiry. Project inquiry entry remains gated
        until Phase 10; both contexts use the same quotation engine. Fulfillment
        thread creation has no public endpoint and Phase 12 entry remains
        disabled.
      security:
        - passportBearer: []
      parameters:
        - name: messagingPortal
          in: path
          required: true
          schema:
            type: string
            enum:
              - buyers
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatIdResponse"
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatIdResponse"
        "401":
          description: Authentication required
        "403":
          description: Current role or channel access denied
        "404":
          description: Conversation unavailable or access revoked
        "409":
          description: Recoverable version, deadline, idempotency or stock conflict;
            re-read the current version
        "422":
          description: Invalid fields or undisclosed NRPC
        "503":
          description: Provider or scanner unavailable; retry safely
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCreate"
