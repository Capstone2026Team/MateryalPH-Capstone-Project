        Each child snapshots its lines (listing, variant, unit, applied price version and frozen volume tiers, tax classification,
        displayed image) and keeps the intended destination and any heavy-vehicle alternate drop-off as separate references.
        Submission never reserves stock. Submitting fewer groups than the cart holds requires split_confirmed. A retry with the same
        Idempotency-Key and body returns the same checkout (200, meta.replayed=true); a changed body under the key is 409
