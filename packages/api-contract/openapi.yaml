      description: Saves a separate Item-Based override. Whole percentages 0–100 for exactly the five components, totalling 100 (422 WEIGHTS_TOTAL_INVALID); all-zero is 422 WEIGHTS_ALL_ZERO. version 0 creates; a stale version is 409 PREFERENCE_VERSION_CONFLICT. Audited.
      tags: [ Buyer Explore ]
      security: [ { passportBearer: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RankingPreferencesUpdate" } } }
      responses:
        "200": { description: Saved preferences., content: { application/json: { schema: { $ref: "#/components/schemas/RankingPreferencesEnvelope" } } } }
