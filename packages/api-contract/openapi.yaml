        manual NRPC. One transaction locks the organization, order and every inventory row in deterministic order, revalidates the
        store (activation, restriction, public profile), online payment capability, listings, tax classification and stock, and
        reserves every confirmed line or none (409 STOCK_INSUFFICIENT / STORE_NOT_ELIGIBLE / LINE_NOT_ELIGIBLE). Owner, Manager, Store
        Staff and Customer Service confirm unchanged orders; revisions and NRPC need Owner, Manager or Store Staff; Site Delivery
        vehicles, trips and the formula fee need Owner or Manager (409 DELIVERY_FEE_CHANGED if the fee differs from the formula).
