      required: [ result_id, tier, tier_label, name, formatted_address, marker, public_phone, website_uri, google_maps_uri, opening_hours, google_rating, attribution, fetched_at, actions ]
      properties:
        result_id: { type: string, format: uuid }
        tier: { type: string, enum: [ DIRECTORY_SUPPLIER ] }
        tier_label: { type: string, enum: [ Directory Supplier ] }
        name: { type: string }
        formatted_address: { type: [ string, 'null' ] }
        marker: { $ref: "#/components/schemas/MapPoint" }
        public_phone: { type: [ string, 'null' ] }
        website_uri: { type: [ string, 'null' ], format: uri }
        google_maps_uri: { type: [ string, 'null' ], format: uri }
        open_now: { type: [ boolean, 'null' ] }
        next_close_time: { type: [ string, 'null' ], format: date-time }
        photos: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/GooglePlacePhoto" } }
