        order_line_id: { type: string, format: uuid }
        label: { type: string }
        principal_centavos: { type: integer, format: int64 }
        line_payable_centavos: { type: integer, format: int64 }
        included_vat_centavos: { type: integer, format: int64 }
    NrpcTermsVersion:
      type: object
      required: [ id, version, title, content, content_hash ]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
