  # Phase 11 payment and finance operations
  "/webhooks/xendit":
    "post":
      "operationId": "receiveXenditPaymentWebhook"
      "tags":
        - "Payment Webhooks"
      "description": "Fast inbox. Verifies x-callback-token in constant time (Xendit documents no HMAC signature header), stores the raw event once by webhook-id, acknowledges, then processes asynchronously. Processing re-reads the session authoritatively and checks identifier, reference, amount, currency, account and transition before anything is PAID. Forged, duplicate, reordered, mismatched or unknown events never create a paid order."
      "security": []
      "parameters":
        - "name": "x-callback-token"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
        - "name": "webhook-id"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PaymentWebhookPayload"
      "responses":
        "200":
          "description": "Authorized result."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PaymentWebhookAckEnvelope"
        "400":
          "$ref": "#/components/responses/ErrorResponse"
        "401":
          "$ref": "#/components/responses/ErrorResponse"
        "413":
          "$ref": "#/components/responses/ErrorResponse"
        "422":
          "$ref": "#/components/responses/ErrorResponse"
        "503":
          "$ref": "#/components/responses/ErrorResponse"
