      description: >-
        Map and list results from one server response with one result identifier and one order (straight-line distance,
        then Verified Vendors before Directory Suppliers, then result id). Membership is PostGIS ST_DWithin on geography
        in metres with an inclusive boundary; route distance and saved hours never affect membership or order. The
        origin travels in the body, is never echoed, and is either an owned saved location, finite Philippine
        coordinates or the primary saved location. Radius expansion is only suggested in meta.expansion and requires
        Buyer confirmation. Directory Suppliers come from Google Places with attribution and are informational only.
      tags: [ Buyer Discovery ]
      security: [ { passportBearer: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DiscoverySearchRequest" } } }
      responses:
        "200": { description: Ordered suppliers., content: { application/json: { schema: { $ref: "#/components/schemas/DiscoverySearchEnvelope" } } } }
