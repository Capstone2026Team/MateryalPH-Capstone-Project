components:
  securitySchemes:
    passportBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    accessCookie: { type: apiKey, in: cookie, name: mp_access }
    mfaChallengeCookie: { type: apiKey, in: cookie, name: mp_mfa_challenge }
    botProofCookie: { type: apiKey, in: cookie, name: mp_bot_proof }
    webCsrf: { type: apiKey, in: header, name: X-CSRF-Token }
  responses:
    GoogleCallbackErrorResponse:
      description: Safe callback failure; HTML for browser navigation and the canonical error envelope for JSON clients.
      content:
        text/html:
          schema: { type: string }
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    ErrorResponse:
      description: Safe structured error with X-Correlation-ID response header.
      headers:
        Retry-After:
          description: For middleware rate limits (429), seconds until retry is allowed. Clients must not automatically retry mutations. Document and media uploads share a 20/minute user and organization limit within the overall 60/minute account limit; security-action limits remain unchanged.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Maximum requests in the applicable rate-limit window.
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: Requests remaining in the applicable rate-limit window.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BotStepUpResponse:
      description: The requested auth operation requires a short-lived email risk-verification step.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BotStepUpErrorEnvelope" }
  schemas:
    ChatIdentity:
      type: object
      required:
        - display_name
        - role
      properties:
        display_name:
          type: string
        role:
          type: string
        avatar_path:
          type: string
          nullable: true
    ChatStore:
      type: object
      required:
        - id
        - name
        - verified
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo_url:
          type: string
          nullable: true
        verified:
          type: boolean
    ConversationView:
      type: object
      required:
        - id
        - purpose
        - context_type
        - lock_version
        - store
        - unread_count
        - channel
        - locked_reference
        - updated_at
        - can_transfer
        - fulfillment_entry_enabled
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - SALES
            - FULFILLMENT
        context_type:
          type: string
          enum:
            - ITEM_BASED
            - PROJECT_BASED
        order_id:
          type: string
          format: uuid
          nullable: true
        lock_version:
          type: integer
        store:
          $ref: "#/components/schemas/ChatStore"
        handler:
          $ref: "#/components/schemas/ChatIdentity"
          nullable: true
        unread_count:
          type: integer
        channel:
          type: string
        locked_reference:
          type: object
          additionalProperties: true
        updated_at:
          type: string
        can_transfer:
          type: boolean
        fulfillment_entry_enabled:
          type: boolean
    ChatAttachment:
      type: object
      required:
        - id
        - display_name
        - media_type
        - size_bytes
        - scan_state
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
        scan_state:
          type: string
          enum:
            - PENDING
            - CLEAN
            - REJECTED
            - FAILED
    ChatMessage:
      type: object
      required:
        - id
        - client_message_id
        - body
        - kind
        - sender
        - sent_at
        - mine
        - attachments
        - read_by_recipient
      properties:
        id:
          type: string
          format: uuid
        client_message_id:
          type: string
          format: uuid
        body:
          type: string
        kind:
          type: string
          enum:
            - TEXT
            - SYSTEM
            - ATTACHMENT
        sender:
          $ref: "#/components/schemas/ChatIdentity"
        sent_at:
          type: string
        mine:
          type: boolean
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ChatAttachment"
        read_by_recipient:
          type: boolean
    ChatMessagePage:
      type: object
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        has_more:
          type: boolean
        next_before:
          type: string
          format: uuid
          nullable: true
    ChatQuotationLine:
      type: object
      required:
        - variant_id
        - quantity
        - unit_price_centavos
        - description
        - unit_code
        - tax_category
        - source_price_version_id
        - source_tax_version_id
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: string
        unit_price_centavos:
          type: integer
        description:
          type: string
        unit_code:
          type: string
        tax_category:
          type: string
        source_price_version_id:
          type: string
          format: uuid
        source_tax_version_id:
          type: string
          format: uuid
    ChatQuotationChange:
      type: object
      required:
        - path
        - label
        - before
        - after
      properties:
        path:
          type: string
        label:
          type: string
        before: {}
        after: {}
    ChatQuotationMoney:
      type: object
      required:
        - materials_payable_centavos
        - materials_vat_centavos
        - vendor_discount_centavos
        - delivery_centavos
        - nrpc_centavos
        - commercial_total_centavos
      properties:
        materials_payable_centavos:
          type: integer
        materials_vat_centavos:
          type: integer
        vendor_discount_centavos:
          type: integer
        delivery_centavos:
          type: integer
        nrpc_centavos:
          type: integer
        commercial_total_centavos:
          type: integer
    ChatQuotationContent:
      type: object
      required:
        - lines
        - commercial
        - fulfillment_method
        - payment_method
        - fulfillment_date
        - changes
        - original_changes
        - price_source
        - processing_fee_status
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChatQuotationLine"
        commercial:
          $ref: "#/components/schemas/ChatQuotationMoney"
        fulfillment_method:
          type: string
        payment_method:
          type: string
        fulfillment_date:
          type: string
        delivery:
          type: object
          additionalProperties: true
          nullable: true
        nrpc:
          type: object
          additionalProperties: true
          nullable: true
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChatQuotationChange"
        original_changes:
          type: array
          items:
            $ref: "#/components/schemas/ChatQuotationChange"
        price_source:
          type: string
          enum:
            - PRIVATE_TRANSACTION
        processing_fee_status:
          type: string
    ChatQuotationVersion:
      type: object
      required:
        - id
        - version
        - latest
        - state
        - published_at
        - expires_at
        - content_hash
        - content
        - viewed
        - actions
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        latest:
          type: boolean
        state:
          type: string
        published_at:
          type: string
        expires_at:
          type: string
        content_hash:
          type: string
        content:
          $ref: "#/components/schemas/ChatQuotationContent"
        viewed:
          type: boolean
        actions:
          type: array
          items:
            type: string
    ChatQuotation:
      type: object
      required:
        - id
        - state
        - lock_version
        - can_draft
        - can_publish
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        lock_version:
          type: integer
        current_version_id:
          type: string
          format: uuid
          nullable: true
        accepted_order_id:
          type: string
          format: uuid
          nullable: true
        response_due_at:
          type: string
          nullable: true
        draft:
          type: object
          additionalProperties: true
          nullable: true
        can_draft:
          type: boolean
        can_publish:
          type: boolean
    ChatQuotationPage:
      type: object
      required:
        - versions
        - has_more
      properties:
        quotation:
          $ref: "#/components/schemas/ChatQuotation"
          nullable: true
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ChatQuotationVersion"
        has_more:
          type: boolean
        page:
          type: integer
    ConversationDetail:
      type: object
      required:
        - conversation
        - messages
        - quotations
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationView"
        messages:
          $ref: "#/components/schemas/ChatMessagePage"
        quotations:
          $ref: "#/components/schemas/ChatQuotationPage"
    ConversationPage:
      type: object
      required:
        - items
        - page
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationView"
        page:
          type: integer
        has_more:
          type: boolean
    ChatCreate:
      type: object
      required:
        - vendor_id
      properties:
        vendor_id:
          type: string
          format: uuid
        listing_variant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        heavy_vehicle_restriction:
          type: string
        alternate_drop_off_location_id:
          type: string
          format: uuid
        access_instructions:
          type: string
        context_type:
          type: string
          enum:
            - ITEM_BASED
            - PROJECT_BASED
    ChatSend:
      type: object
      required:
        - client_message_id
        - body
      properties:
        client_message_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
    ChatRead:
      type: object
      required:
        - through_message_id
      properties:
        through_message_id:
          type: string
          format: uuid
    ChatTransfer:
      type: object
      required:
        - handler_user_id
        - lock_version
        - reason
      properties:
        handler_user_id:
          type: integer
        lock_version:
          type: integer
        reason:
          type: string
          maxLength: 500
    ChatHandler:
      type: object
      required:
        - id
        - display_name
        - role
      properties:
        id:
          type: integer
        display_name:
          type: string
        role:
          type: string
    ChatDraftLine:
      type: object
      required:
        - variant_id
        - quantity
        - unit_price_centavos
      properties:
        description: { type: string, maxLength: 200 }
        specifications: { type: object, additionalProperties: { type: string } }
        variant_id:
          type: string
          format: uuid
        quantity:
          type: string
        unit_price_centavos:
          type: integer
          minimum: 1
          maximum: 100000000000
    ChatDraftContent:
      type: object
      required:
        - lines
        - fulfillment_method
        - payment_method
        - fulfillment_date
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ChatDraftLine"
          minItems: 1
          maxItems: 100
        fulfillment_method:
          type: string
          enum:
            - PICKUP
            - DELIVERY
        payment_method:
          type: string
          enum:
            - ONLINE
            - CASH_ON_DELIVERY
            - IN_STORE
        fulfillment_date:
          type: string
        deadline_hours:
          type: integer
          minimum: 1
          maximum: 72
          default: 24
        vendor_discount_centavos:
          type: integer
        delivery:
          type: object
          additionalProperties: true
        nrpc:
          type: object
          additionalProperties: true
    ChatDraftSave:
      type: object
      required:
        - lock_version
        - draft
      properties:
        lock_version:
          type: integer
        draft:
          $ref: "#/components/schemas/ChatDraftContent"
    ChatPublish:
      type: object
      required:
        - lock_version
      properties:
        lock_version:
          type: integer
    ChatDecision:
      type: object
      required:
        - version_id
      properties:
        budget_override_reason: { type: string, minLength: 10, maxLength: 2000 }
        version_id:
          type: string
          format: uuid
        content_hash:
          type: string
          minLength: 64
          maxLength: 64
        reason:
          type: string
          maxLength: 2000
        nrpc_acknowledged:
          type: boolean
        nrpc_terms_version_id:
          type: string
          format: uuid
    ChatDecisionResult:
      type: object
      required: []
      properties:
        order_id:
          type: string
          format: uuid
          nullable: true
    ChatId:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    ChatRealtime:
      type: object
      required:
        - enabled
        - port
        - scheme
      properties:
        inbox_channel:
          type: string
          nullable: true
          description: Opaque private Buyer inbox channel without the private- prefix; null for non-Buyers. Receives inbox.changed invalidations only. Re-fetch configuration after reconnecting.
        enabled:
          type: boolean
        key:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        port:
          type: integer
        scheme:
          type: string
    ChatChannelAuth:
      type: object
      required:
        - socket_id
        - channel_name
      properties:
        socket_id:
          type: string
        channel_name:
          type: string
    ChatChannelSignature:
      type: object
      required:
        - auth
      properties:
        auth:
          type: string
    ConversationDetailResponse:
