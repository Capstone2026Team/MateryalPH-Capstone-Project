    Meta: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [ code, message, details ]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: [ string, "null" ] }
        correlation_id: { type: [ string, "null" ] }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: [ object, "null" ], additionalProperties: false }
        meta: { $ref: "#/components/schemas/Meta" }
        errors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiError" }
    SuccessEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/Meta" }
        errors: { type: array, maxItems: 0 }
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ status, service, timestamp ]
              properties:
                status: { type: string, const: ok }
                service: { type: string, const: materyalph-api }
                timestamp: { type: string, format: date-time }
    Agreement:
      type: object
      required: [ id, code, title, audience, version, content_uri, effective_at ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        audience: { type: string }
        version: { type: integer, minimum: 1 }
        content_uri: { type: string }
        content: { type: [string, "null"], description: "Maintained Markdown verified against the stored source hash." }
        content_hash: { type: string, description: "SHA-256 of source before configured contact substitution." }
        effective_at: { type: string, format: date-time }
    AgreementListEnvelope:
      type: object
      required: [data, meta, errors]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Agreement" } }
        meta: { type: object, additionalProperties: true }
        errors: { type: array, items: { type: object, additionalProperties: true } }
    CsrfEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ csrf_token ]
              properties: { csrf_token: { type: string } }
    AccountType: { type: string, enum: [ BUYER, VENDOR, ADMIN ] }
    EmailRequest:
      type: object
      required: [ email ]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    RegisterRequest:
      type: object
      description: Vendor web registration. The WEB transport is selected by the server route.
      required:
        [
          full_name,
          email,
          mobile_e164,
          password,
          password_confirmation,
          business_name,
          terms_accepted,
          privacy_accepted
        ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        business_name: { type: string, maxLength: 180 }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor checkbox or accessible email fallback evidence.
    BuyerMobileRegisterRequest:
      type: object
      description: Buyer-native registration. The BUYER/MOBILE transport is selected by the server route and contains no
        CAPTCHA evidence.
      required: [ full_name, email, mobile_e164, password, password_confirmation, buyer_type, terms_accepted, privacy_accepted, terms_version_id, terms_content_hash ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        buyer_type: { type: string, maxLength: 32 }
        company_name: { type: [ string, "null" ], maxLength: 180 }
        terms_version_id: { type: string, description: Reference provider identifier. }
        terms_content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VerifyEmailRequest:
      type: object
      required: [ email, code ]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
    LoginRequest:
      type: object
      description: Vendor/Admin browser login. The WEB transport is selected by the server route.
      required: [ email, password, portal ]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        portal: { type: string, enum: [ VENDOR, ADMIN ] }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor web password login only; prohibited for Admin login.
    BuyerMobileLoginRequest:
      type: object
      description: Buyer-native login. The BUYER/MOBILE transport is selected by the server route and contains no CAPTCHA evidence.
      required: [ email, password ]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_id: { type: [ string, "null" ], format: uuid }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VendorBotProtectionEvidence:
      type: object
      description: >-
        Vendor web only. Supply a checkbox token or explicitly request the accessible email fallback. After successful
        email risk verification, an empty object is permitted because the one-time proof is carried in the HttpOnly
        mp_bot_proof cookie.
      properties:
        recaptcha_token: { type: string, maxLength: 8192, writeOnly: true }
        request_email_step_up:
          type: boolean
          not: { const: false }
          description: Must be true when the accessible email step-up method is selected.
      oneOf:
        - required: [ recaptcha_token ]
        - required: [ request_email_step_up ]
        - maxProperties: 0
    PasswordRecoveryRequest:
      type: object
      description: Vendor/Admin browser password recovery. The WEB transport is selected by the server route.
      required: [ email, portal ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        portal: { type: string, enum: [ VENDOR, ADMIN ] }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor web password recovery only; prohibited for Admin recovery.
    BuyerMobilePasswordRecoveryRequest:
      type: object
      description: Buyer-native password recovery. The BUYER/MOBILE transport is selected by the server route and contains no
        CAPTCHA evidence.
      required: [ email ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VerifyBotChallengeRequest:
      type: object
      required: [ email, code ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^\d{6}$' }
    ResendBotChallengeRequest:
      type: object
      required: [ email ]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    BotProofEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ verified, expires_in ]
              properties:
                verified: { type: boolean, const: true }
                expires_in: { type: integer, minimum: 1 }
                step_up_token: { type: string, writeOnly: true }
    BotStepUpErrorEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: [ object, "null" ] }
        meta: { type: object, additionalProperties: true }
        errors:
          type: array
          minItems: 1
          maxItems: 1
          items:
            title: BotStepUpErrorEnvelope_allOf_errors
            type: object
            required: [ code, message, details ]
            properties:
              code: { type: string, enum: [ BOT_STEP_UP_REQUIRED ] }
              message: { type: string }
              details:
                title: BotStepUpErrorEnvelope_allOf_errors_allOf_details
                type: object
                required: [ challenge_id, expires_at, resend_after_seconds ]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  resend_after_seconds: { type: integer, minimum: 0 }
    MfaCodeRequest:
      type: object
      required: [ code ]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    MfaRecoveryRequest:
      type: object
      required: [ recovery_code ]
      properties:
        recovery_code: { type: string, maxLength: 32, writeOnly: true }
    BuyerMobileRefreshRequest:
      type: object
      required: [ refresh_token ]
      properties:
        refresh_token: { type: string, writeOnly: true, maxLength: 512 }
    PasswordResetRequest:
      type: object
      required: [ email, code, password, password_confirmation ]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
    GoogleOidcStartRequest:
      type: object
      description: Vendor/Admin browser Google OIDC start. The WEB transport is selected by the server route.
      required: [ portal, mode ]
      properties:
        portal: { type: string, enum: [ VENDOR, ADMIN ] }
        mode: { type: string, enum: [ SIGN_IN, SIGN_UP ] }
        mobile_e164: { type: [ string, "null" ] }
        business_name: { type: [ string, "null" ] }
        terms_accepted: { type: boolean }
        privacy_accepted: { type: boolean }
    BuyerMobileGoogleOidcStartRequest:
      type: object
      description: Buyer-native Google OIDC start. The BUYER/MOBILE transport is selected by the server route.
      required: [ mode ]
      properties:
        mode: { type: string, enum: [ SIGN_IN, SIGN_UP ] }
        mobile_e164: { type: [ string, "null" ] }
        buyer_type: { type: [ string, "null" ] }
        company_name: { type: [ string, "null" ], maxLength: 180 }
        terms_version_id: { type: string, format: uuid, description: "Required for SIGN_UP." }
        terms_content_hash: { type: string, pattern: "^[a-f0-9]{64}$", description: "Required for SIGN_UP." }
        terms_accepted: { type: boolean }
        privacy_accepted: { type: boolean }
    GoogleMobileExchangeRequest:
      type: object
      required: [ exchange_code ]
      properties:
        exchange_code: { type: string, writeOnly: true, maxLength: 128 }
        device_id: { type: [ string, "null" ], format: uuid }
    AdminInvitationRequest:
      type: object
      required: [ token, full_name, password, password_confirmation, terms_accepted, privacy_accepted ]
      properties:
        token: { type: string, writeOnly: true }
        full_name: { type: string, maxLength: 160 }
        password: { type: string, format: password, minLength: 14 }
        password_confirmation: { type: string, format: password }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
    UserIdentity:
      type: object
      required: [ id, name, email, account_type ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        account_type: { $ref: "#/components/schemas/AccountType" }
    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                user: { $ref: "#/components/schemas/UserIdentity" }
                session_id: { type: string, format: uuid }
                access_token: { type: string, writeOnly: true }
                refresh_token: { type: string, writeOnly: true }
                access_expires_in: { type: integer }
                refresh_expires_in: { type: integer }
                mfa_setup_required: { type: boolean }
                mfa_required: { type: boolean }
                mfa_enrollment_required: { type: boolean }
                challenge_expires_in: { type: integer, minimum: 1 }
                recovery_codes:
                  type: array
                  description: Present only immediately after enrollment or recovery; store offline because these values are not returned
                    again.
                  items: { type: string, writeOnly: true }
    MfaStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ mfa_required, mfa_enrollment_required ]
              properties:
                mfa_required: { type: boolean, const: true }
                mfa_enrollment_required: { type: boolean }
    MfaEnrollmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ secret, provisioning_uri ]
              properties:
                secret: { type: string, writeOnly: true }
                provisioning_uri: { type: string, writeOnly: true }
    RegistrationEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                verification_required: { type: boolean }
                next: { type: string }
    VendorOnboardingStep:
      type: object
      required: [ id, key, label, level, status, lock_version ]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        level: { type: string, enum: [ REQUIRED, OPTIONAL, CONDITIONALLY_REQUIRED ] }
        status: { type: string, enum: [ NOT_STARTED, IN_PROGRESS, SUBMITTED, PENDING_VERIFICATION, APPROVED, CHANGES_REQUIRED, REJECTED, EXPIRED, NOT_APPLICABLE, COMPLETED ] }
        reason: { type: [ string, 'null' ] }
        lock_version: { type: integer, minimum: 1 }
        submitted_at: { type: [ string, 'null' ], format: date-time }
        reviewed_at: { type: [ string, 'null' ], format: date-time }
    VendorOnboardingSection:
      type: object
      required: [ key, label, status, complete, total, progress, steps ]
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string }
        complete: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        progress: { type: object, additionalProperties: true }
        steps: { type: array, items: { $ref: "#/components/schemas/VendorOnboardingStep" } }
    OnboardingRequirement:
      type: object
      required: [ key, workstream, level, status, blocking, blocking_reason, applicability_reason, correction_reason, lock_version ]
      properties:
        key: { type: string }
        workstream: { type: string, enum: [ STORE_VERIFICATION, STORE_SETUP ] }
        level: { type: string, enum: [ REQUIRED, OPTIONAL, CONDITIONALLY_REQUIRED ] }
        status: { type: string, enum: [ NOT_STARTED, IN_PROGRESS, SUBMITTED, PENDING_VERIFICATION, APPROVED, COMPLETED, CHANGES_REQUIRED, REJECTED, EXPIRED, NOT_APPLICABLE ] }
        blocking: { type: boolean }
        blocking_reason: { type: [ string, 'null' ] }
        applicability_reason: { type: [ string, 'null' ], description: 'Required nonempty reason for an inapplicable conditional requirement. Never used for REQUIRED items.' }
        correction_reason: { type: [ string, 'null' ] }
        lock_version: { type: integer, minimum: 1 }
    OnboardingDraftVersion:
      type: object
      required: [ workstream, lock_version ]
      properties:
        workstream: { type: string, enum: [ STORE_VERIFICATION, STORE_SETUP ] }
        lock_version: { type: integer, minimum: 1 }
    StoreActivationBlocker:
      type: object
      required: [ key, condition, reason ]
      properties:
        key: { type: string }
        condition: { type: integer, minimum: 1, maximum: 10 }
        reason: { type: string }
    StoreActivationReadiness:
      type: object
      required: [ ready, status, rule_version, blockers ]
      properties:
        ready: { type: boolean }
        status: { type: string, enum: [ READY, NOT_READY ] }
        rule_version: { type: string }
        blockers: { type: array, items: { $ref: "#/components/schemas/StoreActivationBlocker" } }
    VendorActivationSnapshot:
      type: object
      required: [ status, marketplace_discoverability_status, readiness ]
      properties:
        status: { type: string }
        marketplace_discoverability_status: { type: string }
        readiness: { $ref: "#/components/schemas/StoreActivationReadiness" }
    OnboardingStepCompletion:
      type: object
      required: [ key, workstream, complete, required ]
      properties:
        key: { type: string, enum: [ V1, V2, V3, V4, S1, S2, S3, S4, S5, S6 ] }
        workstream: { type: string, enum: [ STORE_VERIFICATION, STORE_SETUP ] }
        complete: { type: boolean, description: 'All applicable mandatory requirements have their successful final status.' }
        required: { type: boolean }
    VendorOnboardingSnapshot:
      type: object
      required: [ organization, sections, verification, setup, activation, welcome_required, permissions, requirements, drafts, lock_version, step_completion ]
      properties:
        step_completion: { type: array, items: { $ref: "#/components/schemas/OnboardingStepCompletion" } }
        lock_version: { type: integer, minimum: 1 }
        requirements: { type: array, items: { $ref: "#/components/schemas/OnboardingRequirement" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/OnboardingDraftVersion" } }
        organization: { type: object, additionalProperties: true }
        sections: { type: object, additionalProperties: { $ref: "#/components/schemas/VendorOnboardingSection" } }
        verification: { type: object, additionalProperties: true, description: 'Private verification snapshot. Each documents entry includes its latest Admin review (decision, reason, verified_document_number, verified_issue_date, expiration_kind, verified_expiration_date, evidence_source, remarks, reviewed_at), or null when not reviewed.' }
        setup:
