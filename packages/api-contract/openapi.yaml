openapi: 3.1.0
info:
  title: MateryalPH API
  version: 1.0.0-phase.4
  description: >-
    Versioned Phase 1–4 contract. Vendor onboarding, verification, activation readiness, private evidence, team invitations, the Vendor catalog and product PS/ICC compliance are server-authorized.
    Browser credentials are isolated by configured frontend origin using _vendor and _admin suffixes on access, refresh, CSRF, MFA and bot-proof cookies.
    Existing unsuffixed browser sessions require sign-in again; cookie selection never replaces account authorization. Native Buyer transport is unchanged.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Agreements
  - name: Authentication
  - name: Vendor Onboarding
  - name: Stores
  - name: Admin Vendor Verification
  - name: Vendor Catalog
  - name: Admin Product Compliance
paths:
  /{webAccountPortal}/account/photo:
    parameters:
      - { name: webAccountPortal, in: path, required: true, schema: { type: string, enum: [vendors, admin] } }
    post:
      operationId: uploadAccountPhoto
      tags: [Accounts]
      security: [{ accessCookie: [], webCsrf: [] }]
      description: Owner-only personal photo. Maximum 2 MB JPEG/PNG/WebP and 4096 pixels per dimension. Malware-scanned, re-encoded to 256px PNG, privately stored. Five uploads/minute within the overall account budget. Fails closed if scanning or processing is unavailable.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo, lock_version]
              properties:
                photo: { type: string, format: binary }
                lock_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated personal profile., content: { application/json: { schema: { $ref: '#/components/schemas/AccountProfileEnvelope' } } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '419': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
        '429': { $ref: '#/components/responses/ErrorResponse' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
    get:
      operationId: getAccountPhoto
      tags: [Accounts]
      security: [{ accessCookie: [] }]
      description: Use the five-minute signed avatar_url from the profile. Authenticated owner only; private no-store response. No user identifier is accepted.
      parameters:
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer } }
        - { name: owner, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Sanitized personal photo., content: { image/png: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /health:
    get:
      operationId: getApiHealth
      tags: [ System ]
      responses:
        "200":
          description: API process is available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }
  /agreements/current:
    get:
      operationId: listCurrentAgreements
      tags: [ Agreements ]
      responses:
        "200":
          description: Effective agreement metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementListEnvelope" }
  /auth/csrf:
    get:
      operationId: issueWebCsrfToken
      tags: [ Authentication ]
      responses:
        "200":
          description: Token body plus the non-HttpOnly mp_csrf cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfEnvelope" }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Restricted account; email verification is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationEnvelope" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Email ownership verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /auth/verify-email/resend:
    post:
      operationId: resendEmailVerification
      description: Issues a new code for a pending Vendor account or an active Vendor account whose Owner email is still unverified. The response does not reveal whether an eligible account exists.
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200":
          description: Generic anti-enumeration response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/login:
    post:
      operationId: login
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Web receives HttpOnly cookies; privileged web roles receive an MFA challenge cookie before any session is
            issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      responses:
        "200":
          description: Refresh token family rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /auth/session:
    get:
      operationId: getSession
      tags: [ Authentication ]
      security: [ { accessCookie: [] } ]
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /auth/logout:
    post:
      operationId: logout
      tags: [ Authentication ]
      security:
        - accessCookie: []
          webCsrf: []
      responses:
        "200":
          description: Session revoked and cookies expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
  /auth/password/forgot:
    post:
      operationId: requestPasswordRecovery
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryRequest" }
      responses:
        "200":
          description: Generic anti-enumeration response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          description: Password changed and prior sessions revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /auth/bot-challenges/{challenge_id}/verify:
    post:
      operationId: verifyBotChallenge
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyBotChallengeRequest" }
      responses:
        "200":
          description: Vendor risk OTP verified; the proof is returned only in an HttpOnly cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotProofEnvelope" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/bot-challenges/{challenge_id}/resend:
    post:
      operationId: resendBotChallenge
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendBotChallengeRequest" }
      responses:
        "200":
          description: Generic anti-enumeration resend response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/google/start:
    post:
      operationId: startGoogleOidc
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleOidcStartRequest" }
      responses:
        "200":
          description: Short-lived authorization URL using PKCE and nonce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /auth/google/callback:
    get:
      operationId: completeGoogleOidc
      tags: [ Authentication ]
      description: Browser requests accepting text/html receive a safe branded error page on callback failure. JSON requests
        retain the canonical error envelope. No callback parameters are reflected into the HTML page.
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        "302":
          {
            description: "Validated OIDC redirect to a web portal with HttpOnly cookies, to the Buyer app with a two-minute one-time
              exchange code, or to an allowlisted web portal callback with a stable error code for an expected
              identity/access denial."
          }
        "401": { $ref: "#/components/responses/GoogleCallbackErrorResponse" }
        "403": { $ref: "#/components/responses/GoogleCallbackErrorResponse" }
        "404": { $ref: "#/components/responses/GoogleCallbackErrorResponse" }
        "422": { $ref: "#/components/responses/GoogleCallbackErrorResponse" }
        "503": { $ref: "#/components/responses/GoogleCallbackErrorResponse" }
  /mobile/auth/register:
    post:
      operationId: registerBuyerMobile
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerMobileRegisterRequest" }
      responses:
        "201":
          description: Restricted Buyer account; email verification is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationEnvelope" }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/login:
    post:
      operationId: loginBuyerMobile
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerMobileLoginRequest" }
      responses:
        "200":
          description: Native Passport access and refresh tokens returned in the response body; no browser authentication cookie
            is issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/verify-email:
    post:
      operationId: verifyBuyerMobileEmail
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          {
            description: Buyer email ownership verified,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/verify-email/resend:
    post:
      operationId: resendBuyerMobileEmailVerification
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "200":
          {
            description: Generic anti-enumeration response,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/password/forgot:
    post:
      operationId: requestBuyerMobilePasswordRecovery
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerMobilePasswordRecoveryRequest" }
      responses:
        "200":
          {
            description: Generic anti-enumeration response,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "403": { $ref: "#/components/responses/BotStepUpResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/password/reset:
    post:
      operationId: resetBuyerMobilePassword
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          {
            description: Buyer password changed and prior sessions revoked,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/bot-challenges/{challenge_id}/verify:
    post:
      operationId: verifyBuyerMobileBotChallenge
      tags: [ Authentication ]
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyBotChallengeRequest" }
      responses:
        "200":
          {
            description: Buyer email risk OTP verified and one-time proof returned in the response body,
            content: { application/json: { schema: { $ref: "#/components/schemas/BotProofEnvelope" } } }
          }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/bot-challenges/{challenge_id}/resend:
    post:
      operationId: resendBuyerMobileBotChallenge
      tags: [ Authentication ]
      parameters:
        - in: path
          name: challenge_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendBotChallengeRequest" }
      responses:
        "200":
          {
            description: Generic anti-enumeration resend response,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/google/start:
    post:
      operationId: startBuyerMobileGoogleOidc
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerMobileGoogleOidcStartRequest" }
      responses:
        "200":
          {
            description: Short-lived Buyer authorization URL using PKCE and nonce,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/google/exchange:
    post:
      operationId: exchangeBuyerMobileGoogleCode
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleMobileExchangeRequest" }
      responses:
        "200":
          {
            description: One-time mobile exchange consumed and Passport session returned without browser cookies,
            content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } }
          }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/refresh:
    post:
      operationId: refreshBuyerMobileSession
      tags: [ Authentication ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerMobileRefreshRequest" }
      responses:
        "200":
          {
            description: Native refresh token family rotated and replacement tokens returned in the body,
            content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } }
          }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/session:
    get:
      operationId: getBuyerMobileSession
      tags: [ Authentication ]
      security: [ { passportBearer: [] } ]
      responses:
        "200":
          {
            description: Current Buyer identity from the Bearer token,
            content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } }
          }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /mobile/auth/logout:
    post:
      operationId: logoutBuyerMobile
      tags: [ Authentication ]
      security: [ { passportBearer: [] } ]
      responses:
        "200":
          {
            description: Native Passport session revoked without issuing browser cookies,
            content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } }
          }
  /auth/mfa/status:
    get:
      operationId: getMfaChallengeStatus
      tags: [ Authentication ]
      security: [ { mfaChallengeCookie: [] } ]
      responses:
        "200":
          description: Current privileged-login MFA requirement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatusEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      tags: [ Authentication ]
      security:
        - mfaChallengeCookie: []
          webCsrf: []
      responses:
        "200":
          description: One-time authenticator secret and provisioning URI. The secret is never logged or persisted in plaintext.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaEnrollmentEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /auth/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      tags: [ Authentication ]
      security:
        - mfaChallengeCookie: []
          webCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: MFA enrolled, Passport session issued, and replacement recovery codes shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /auth/mfa/challenge:
    post:
      operationId: completeMfaChallenge
      tags: [ Authentication ]
      security:
        - mfaChallengeCookie: []
          webCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCodeRequest" }
      responses:
        "200":
          description: TOTP verified and Passport session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/mfa/recovery:
    post:
      operationId: recoverMfaChallenge
      tags: [ Authentication ]
      security:
        - mfaChallengeCookie: []
          webCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRecoveryRequest" }
      responses:
        "200":
          description: Single-use recovery code consumed, Passport session issued, and all recovery codes replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthEnvelope" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "429": { $ref: "#/components/responses/ErrorResponse" }
  /auth/admin-invitations/accept:
    post:
      operationId: acceptAdminInvitation
      tags: [ Authentication ]
      security: [ { webCsrf: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminInvitationRequest" }
      responses:
        "201":
          description: Admin identity created; MFA enrollment is the next required step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationEnvelope" }
        "410": { $ref: "#/components/responses/ErrorResponse" }
  "/{accountPortal}/account/profile":
    {
      "get":
        {
          "operationId": "getAccountProfile",
          "tags": [ "Accounts" ],
          "description": "Server enforces the route audience, active account and membership, resource ownership, Passport scope
            and session transport. buyers uses MOBILE bearer; vendors/admin use WEB cookies and CSRF on mutations.
            Privileged security changes require session-bound recent authentication. No client header can select or
            bypass transport security.",
          "parameters":
            [
              {
                  "name": "accountPortal",
                  "in": "path",
                  "required": true,
                  "schema": { "type": "string", "enum": [ "buyers", "vendors", "admin" ] }
                }
            ],
          "security": [ { "passportBearer": [] }, { "accessCookie": [] } ],
          "responses":
            {
              "200":
                {
                  "description": "Successful account operation.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AccountProfileEnvelope" } } }
                },
              "401":
                {
                  "description": "Safe canonical error with correlation identifier.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
                },
              "403":
                {
                  "description": "Safe canonical error with correlation identifier.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
                },
              "404":
                {
                  "description": "Safe canonical error with correlation identifier.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
                },
              "409":
                {
                  "description": "Safe canonical error with correlation identifier.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
                },
              "419":
                {
                  "description": "Safe canonical error with correlation identifier.",
                  "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
                },
