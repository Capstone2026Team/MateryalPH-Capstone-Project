        (409 PRICE_CHANGED) and quantity (422 QUANTITY_INVALID or QUANTITY_UNAVAILABLE without revealing stock). Creates no
        inventory hold or reservation. Idempotency-Key makes retries safe; a changed body under the same key is 409.
      tags: [ Buyer Cart ]
      security: [ { passportBearer: [] } ]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CartItemCreate" } } }
