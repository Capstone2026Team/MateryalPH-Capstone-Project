      tags: [ Admin Vendor Verification ]
      security: [ { accessCookie: [] } ]
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Five-minute authorized signed private-evidence URL., content: { application/json: { schema: { $ref: "#/components/schemas/VendorFileEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /admin/vendor-verification/{organizationId}/restrict:
    post:
      operationId: restrictVendorActivation
      tags: [ Admin Vendor Verification ]
      security: [ { accessCookie: [], webCsrf: [] } ]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VendorRestriction" } } }
      responses:
        "200": { description: Administrative activation restriction recorded., content: { application/json: { schema: { $ref: "#/components/schemas/VendorRestrictionEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /admin/vendor-verification/{organizationId}/restore:
    post:
      operationId: restoreVendorActivation
      tags: [ Admin Vendor Verification ]
      security: [ { accessCookie: [], webCsrf: [] } ]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VendorRestriction" } } }
      responses:
        "200": { description: Administrative activation restoration recorded., content: { application/json: { schema: { $ref: "#/components/schemas/VendorRestrictionEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /vendor-onboarding-files/{fileId}/content:
    get:
      operationId: downloadVendorOnboardingFile
      tags: [ Vendor Onboarding ]
      security: [ { accessCookie: [] } ]
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Authorized private file stream., content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /webhooks/xendit/account-verification:
    post:
      operationId: receiveXenditAccountVerificationWebhook
      tags: [ Vendor Onboarding ]
      parameters:
        - { name: x-callback-token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/XenditAccountVerificationWebhook" } } }
      responses:
        "202": { description: Verified and replay-safe provider event accepted., content: { application/json: { schema: { $ref: "#/components/schemas/VendorWebhookEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "422": { $ref: "#/components/responses/ErrorResponse" }
        "503": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    passportBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    accessCookie: { type: apiKey, in: cookie, name: mp_access }
    mfaChallengeCookie: { type: apiKey, in: cookie, name: mp_mfa_challenge }
    botProofCookie: { type: apiKey, in: cookie, name: mp_bot_proof }
    webCsrf: { type: apiKey, in: header, name: X-CSRF-Token }
  responses:
    GoogleCallbackErrorResponse:
      description: Safe callback failure; HTML for browser navigation and the canonical error envelope for JSON clients.
      content:
        text/html:
          schema: { type: string }
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    ErrorResponse:
      description: Safe structured error with X-Correlation-ID response header.
      headers:
        Retry-After:
          description: For middleware rate limits (429), seconds until retry is allowed. Clients must not automatically retry mutations. Document and media uploads share a 20/minute user and organization limit within the overall 60/minute account limit; security-action limits remain unchanged.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Maximum requests in the applicable rate-limit window.
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: Requests remaining in the applicable rate-limit window.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BotStepUpResponse:
      description: The requested auth operation requires a short-lived email risk-verification step.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BotStepUpErrorEnvelope" }
  schemas:
    "AccountProfile":
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "full_name",
            "email",
            "account_type",
            "account_status",
            "lock_version",
            "created_at",
            "buyer_type",
            "company_name",
            "organization_name",
            "role",
            "organization_id",
            "membership_id",
            "can_manage_staff",
            "permissions"
          ],
        "properties":
          {
            "id": { "type": "string" },
            "full_name": { "type": "string" },
            "avatar_url": { "type": ["string", "null"], "description": "Short-lived owner-only personal photo URL; never the store logo." },
            "mobile_e164": { "type": ["string", "null"], "description": "Authenticated Buyer registered contact number." },
            "email_masked": { "type": "boolean", "description": "Buyer email stays masked until recent identity verification." },
            "email": { "type": "string" },
            "account_type": { "type": "string" },
            "account_status": { "type": "string" },
            "lock_version": { "type": "integer" },
            "created_at": { "type": [ "string", "null" ] },
            "buyer_type": { "type": [ "string", "null" ] },
            "company_name": { "type": [ "string", "null" ] },
            "organization_name": { "type": [ "string", "null" ] },
            "role": { "type": "string" },
            "organization_id": { "type": [ "string", "null" ] },
            "membership_id": { "type": [ "string", "null" ] },
            "can_manage_staff": { "type": "boolean" },
            "permissions": { "type": "array", "items": { "type": "string" } }
          }
      }
    "AccountProfileUpdate":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "full_name", "lock_version" ],
        "properties":
          {
            "full_name": { "type": "string", "maxLength": 160 },
            "lock_version": { "type": "integer", "minimum": 1 },
            "buyer_type": { "type": "string", "enum": [ "INDIVIDUAL", "BUSINESS" ] },
            "company_name": { "type": [ "string", "null" ] }
          }
      }
    "AccountSession":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "description", "current", "created_at", "last_active_at" ],
        "properties":
          {
            "id": { "type": "string" },
            "description": { "type": "string" },
            "current": { "type": "boolean" },
            "created_at": { "type": [ "string", "null" ] },
            "last_active_at": { "type": [ "string", "null" ] }
          }
      }
    "AccountSecurity":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "totp_enrolled", "recent_authentication_expires_at" ],
        "properties": { "totp_enrolled": { "type": "boolean" }, "recent_authentication_expires_at": { "type": [ "string", "null" ] } }
      }
    "AccountReauthentication":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties":
          {
            "password": { "type": [ "string", "null" ] },
            "code": { "type": [ "string", "null" ] },
            "email_code": { "type": [ "string", "null" ] }
          }
      }
    "AccountPasswordChange":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "password", "password_confirmation" ],
        "properties": { "password": { "type": "string", "minLength": 14, "maxLength": 1024 }, "password_confirmation": { "type": "string" } }
      }
    "AccountEmailChange":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "email" ],
        "properties": { "email": { "type": "string", "format": "email" } }
      }
    "AccountCodeConfirmation":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "code" ],
        "properties": { "id": { "type": "string", "format": "uuid" }, "code": { "type": "string", "pattern": "^[0-9]{6}$" } }
      }
    "AccountPendingChange":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "expires_at" ],
        "properties": { "id": { "type": "string" }, "expires_at": { "type": "string" } }
      }
    "AccountFactorEnrollment":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "expires_at", "secret", "provisioning_uri" ],
        "properties":
          {
            "id": { "type": "string" },
            "expires_at": { "type": "string" },
            "secret": { "type": "string" },
            "provisioning_uri": { "type": "string" }
          }
      }
    "AccountRecoveryCodes":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "recovery_codes" ],
        "properties": { "recovery_codes": { "type": "array", "items": { "type": "string" } }, "sign_in_required": { "type": "boolean" } }
      }
    "AccountMutationResult":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties":
          {
            "changed": { "type": "boolean" },
            "verified": { "type": "boolean" },
            "revoked": { "type": "boolean" },
            "accepted": { "type": "boolean" },
            "queued": { "type": "boolean" },
            "sign_in_required": { "type": "boolean" },
            "next": { "type": "string" }
          }
      }
    "AccountSessionRevocation":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "scope" ],
        "properties": { "scope": { "type": "string", "enum": [ "OTHERS", "ALL" ] } }
      }
    "AccountAgreement":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "code", "title", "version", "content", "content_available", "accepted_at", "requires_acceptance" ],
        "properties":
          {
            "id": { "type": "string" },
            "code": { "type": "string" },
            "title": { "type": "string" },
            "version": { "type": "integer" },
            "content": { "type": [ "string", "null" ] },
            "content_available": { "type": "boolean" },
            "accepted_at": { "type": [ "string", "null" ] },
            "requires_acceptance": { "type": "boolean" }
          }
      }
    "AccountAgreementAcceptance":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "version_ids" ],
        "properties": { "version_ids": { "type": "array", "items": { "type": "string", "format": "uuid" } } }
      }
    "AccountMembership":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "name", "role", "status", "can_manage_staff" ],
        "properties":
          {
            "id": { "type": "string" },
            "name": { "type": "string" },
            "role": { "type": "string" },
            "status": { "type": "string" },
            "can_manage_staff": { "type": "boolean" }
          }
      }
    "AccountDelegation":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "can_manage_staff" ],
        "properties": { "can_manage_staff": { "type": "boolean" } }
      }
    "AccountMembershipStatus":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "status" ],
        "properties": { "status": { "type": "string", "enum": [ "ACTIVE", "SUSPENDED", "DEACTIVATED" ] } }
      }
    "AccountAdministrator":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "name", "role", "role_id", "status", "lock_version" ],
        "properties":
          {
            "id": { "type": "string" },
            "name": { "type": "string" },
            "role": { "type": "string" },
            "role_id": { "type": "string" },
            "status": { "type": "string" },
            "lock_version": { "type": "integer" }
          }
      }
    "AccountAdminChange":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "lock_version", "reason" ],
        "properties":
          {
            "lock_version": { "type": "integer" },
            "reason": { "type": "string", "minLength": 3, "maxLength": 500 },
            "status": { "type": "string", "enum": [ "ACTIVE", "SUSPENDED", "DEACTIVATED" ] },
            "role_id": { "type": "string", "format": "uuid" }
          }
      }
    "AccountRole":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "id", "code", "name" ],
        "properties": { "id": { "type": "string" }, "code": { "type": "string" }, "name": { "type": "string" } }
      }
    "AccountAdminInvitation":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "email", "role_id" ],
        "properties": { "email": { "type": "string", "format": "email" }, "role_id": { "type": "string", "format": "uuid" } }
      }
    "VendorInvitationAcceptance":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "token", "email", "full_name", "password", "password_confirmation" ],
        "properties":
          {
            "token": { "type": "string" },
            "email": { "type": "string", "format": "email" },
            "full_name": { "type": "string" },
            "password": { "type": "string", "minLength": 14 },
            "password_confirmation": { "type": "string" }
          }
      }
    "AccountProfileEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountProfile" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountSecurityEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountSecurity" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountPendingChangeEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountPendingChange" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountFactorEnrollmentEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountFactorEnrollment" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountRecoveryCodesEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountRecoveryCodes" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountMutationResultEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "$ref": "#/components/schemas/AccountMutationResult" },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountSessionListEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "type": "array", "items": { "$ref": "#/components/schemas/AccountSession" } },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountAgreementListEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "type": "array", "items": { "$ref": "#/components/schemas/AccountAgreement" } },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountMembershipListEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "type": "array", "items": { "$ref": "#/components/schemas/AccountMembership" } },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountRoleListEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "type": "array", "items": { "$ref": "#/components/schemas/AccountRole" } },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }
    "AccountAdministratorListEnvelope":
      {
        "type": "object",
        "additionalProperties": false,
        "required": [ "data", "meta", "errors" ],
        "properties":
          {
            "data": { "type": "array", "items": { "$ref": "#/components/schemas/AccountAdministrator" } },
            "meta": { "type": "object", "additionalProperties": true },
            "errors": { "type": "array", "items": { "type": "object", "additionalProperties": true } }
          }
      }

    Meta: { type: object, additionalProperties: true }
    ApiError:
      type: object
      required: [ code, message, details ]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: [ string, "null" ] }
        correlation_id: { type: [ string, "null" ] }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: [ object, "null" ], additionalProperties: false }
        meta: { $ref: "#/components/schemas/Meta" }
        errors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ApiError" }
    SuccessEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/Meta" }
        errors: { type: array, maxItems: 0 }
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ status, service, timestamp ]
              properties:
                status: { type: string, const: ok }
                service: { type: string, const: materyalph-api }
                timestamp: { type: string, format: date-time }
    Agreement:
      type: object
      required: [ id, code, title, audience, version, content_uri, effective_at ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        audience: { type: string }
        version: { type: integer, minimum: 1 }
        content_uri: { type: string }
        content: { type: [string, "null"], description: "Maintained Markdown verified against the stored source hash." }
        content_hash: { type: string, description: "SHA-256 of source before configured contact substitution." }
        effective_at: { type: string, format: date-time }
    AgreementListEnvelope:
      type: object
      required: [data, meta, errors]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Agreement" } }
        meta: { type: object, additionalProperties: true }
        errors: { type: array, items: { type: object, additionalProperties: true } }
    CsrfEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [ csrf_token ]
              properties: { csrf_token: { type: string } }
    AccountType: { type: string, enum: [ BUYER, VENDOR, ADMIN ] }
    EmailRequest:
      type: object
      required: [ email ]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    RegisterRequest:
      type: object
      description: Vendor web registration. The WEB transport is selected by the server route.
      required:
        [
          full_name,
          email,
          mobile_e164,
          password,
          password_confirmation,
          business_name,
          terms_accepted,
          privacy_accepted
        ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        business_name: { type: string, maxLength: 180 }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        bot_protection:
          allOf: [ { $ref: "#/components/schemas/VendorBotProtectionEvidence" } ]
          description: Vendor checkbox or accessible email fallback evidence.
    BuyerMobileRegisterRequest:
      type: object
      description: Buyer-native registration. The BUYER/MOBILE transport is selected by the server route and contains no
        CAPTCHA evidence.
      required: [ full_name, email, mobile_e164, password, password_confirmation, buyer_type, terms_accepted, privacy_accepted, terms_version_id, terms_content_hash ]
      properties:
        full_name: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        mobile_e164: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        password: { type: string, format: password, minLength: 12 }
        password_confirmation: { type: string, format: password }
        buyer_type: { type: string, maxLength: 32 }
        company_name: { type: [ string, "null" ], maxLength: 180 }
        terms_version_id: { type: string, format: uuid }
        terms_content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        terms_accepted: { type: boolean, const: true }
        privacy_accepted: { type: boolean, const: true }
        risk_proof_token:
          type: string
          maxLength: 128
          writeOnly: true
          description: Buyer-only proof returned after a server-issued email risk challenge; this is not CAPTCHA evidence.
    VerifyEmailRequest:
      type: object
      required: [ email, code ]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
    LoginRequest:
      type: object
      description: Vendor/Admin browser login. The WEB transport is selected by the server route.
      required: [ email, password, portal ]
      properties:
