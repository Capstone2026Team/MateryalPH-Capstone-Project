          type: object
        meta:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
    BuyerOriginRequest:
      description: Send location_id or latitude/longitude (never both). Omit both to use the primary saved location. radius_km defaults to the saved preference.
      type: object
      additionalProperties: false
      properties:
        location_id: { type: [ string, 'null' ], format: uuid }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        origin_source: { type: string, enum: [ DEVICE, MAP_PIN, SEARCH ] }
        radius_km: { type: integer, description: 'Must be one of 5, 10, 20, 30, 40 or 50; otherwise 422 RADIUS_UNSUPPORTED.' }
    ExploreCounts:
      type: object
      required: [ verified_vendors, vendor_listings ]
      properties:
        verified_vendors: { type: integer, minimum: 0, description: Distinct active Tier 2 organizations with at least one eligible listing in scope. }
        vendor_listings: { type: integer, minimum: 0, description: Distinct Vendor listings with at least one eligible variant; variants never inflate it. }
