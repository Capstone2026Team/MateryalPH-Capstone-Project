      responses:
        "200": { description: Cart., content: { application/json: { schema: { $ref: "#/components/schemas/CartEnvelope" } } } }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
