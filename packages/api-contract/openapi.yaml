        attributes: { type: array, items: { $ref: "#/components/schemas/GooglePlaceAttribute" } }
        provider_attributions: { type: array, items: { $ref: "#/components/schemas/GoogleContentAuthor" } }
        opening_hours: { type: array, items: { type: string } }
        google_rating: { oneOf: [ { $ref: "#/components/schemas/GoogleRating" }, { type: 'null' } ] }
        attribution: { $ref: "#/components/schemas/ProviderAttribution" }
        fetched_at: { type: string, format: date-time }
        actions: { type: array, items: { type: string, enum: [ CALL, OPEN_IN_MAPS, WEBSITE, SHARE ] } }
    DirectorySupplierPhoto:
      type: object
      additionalProperties: false
      required: [ photos, provider_attributions ]
      properties:
        photos: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/GooglePlacePhoto" } }
        provider_attributions: { type: array, items: { $ref: "#/components/schemas/GoogleContentAuthor" } }
    DirectorySupplierPhotoEnvelope:
      type: object
      required: [ data, meta, errors ]
      properties:
        data: { $ref: "#/components/schemas/DirectorySupplierPhoto" }
