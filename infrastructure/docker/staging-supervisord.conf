[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/null -c /tmp/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=110
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freshclam]
command=freshclam --daemon --foreground --stdout --config-file=/app/infrastructure/freshclam.conf
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
