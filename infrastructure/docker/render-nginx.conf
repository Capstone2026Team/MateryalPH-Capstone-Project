pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings can contain OAuth codes, invitations and private URL signatures.
    log_format safe_request '$request_method $uri $status $request_time';
    access_log /dev/stdout safe_request;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 32m;
    # Generated from the two configured public origins, never an arbitrary forwarded hostname.
    include /tmp/nginx/portal-hosts.conf;
    server {
        listen 10000;
        root /app/services/api/public;
        index index.php;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "private, no-store" always;
        # A live FPM ping on its own pool stays responsive while API workers are busy.
        # The JSON /api/v1/health route still exercises Laravel normally.
        location = /up {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /up;
            fastcgi_pass unix:/tmp/php-fpm-health.sock;
            fastcgi_connect_timeout 1s;
            fastcgi_read_timeout 2s;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/services/api/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTP_HOST $portal_host;
            fastcgi_param HTTP_X_FORWARDED_HOST $portal_host;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_param HTTP_X_FORWARDED_PORT 443;
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_read_timeout 120s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
