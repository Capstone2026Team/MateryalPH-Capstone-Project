Foreground yes
User app
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
TemporaryDirectory /tmp
LogTime yes
LogClean no
LogVerbose no
SelfCheck 60
ConcurrentDatabaseReload no
MaxThreads 2
MaxQueue 12
MaxConnectionQueueLength 16
CommandReadTimeout 5
ReadTimeout 30
SendBufTimeout 1000
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxScanTime 20000
MaxRecursion 16
MaxFiles 1000
AlertExceedsMax yes
