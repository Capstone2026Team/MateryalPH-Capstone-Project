[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/null -c /app/infrastructure/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freshclam]
command=freshclam --daemon --foreground --stdout --config-file=/app/infrastructure/freshclam.conf
autostart=%(ENV_RUN_FRESHCLAM)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Free preview: these stop when the API sleeps. No dedicated paid resources are created.
[program:queue]
command=php artisan queue:work redis --queue=default --sleep=2 --tries=3 --timeout=20 --memory=128 --no-interaction
directory=/app/services/api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/app/services/api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
