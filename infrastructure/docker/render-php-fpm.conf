[global]
error_log = /proc/self/fd/2
daemonize = no
[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[memory_limit] = 192M

; Render's five-second probe must not queue behind ordinary API/provider work.
; This pool only answers FPM's built-in ping; it never boots Laravel or exposes status.
[health]
listen = /tmp/php-fpm-health.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
ping.path = /up
ping.response = ok
clear_env = no
php_admin_value[memory_limit] = 16M
