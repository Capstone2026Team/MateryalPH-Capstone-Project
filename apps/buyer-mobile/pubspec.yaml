name: materyalph
description: "MateryalPH Buyer mobile application."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  app_links: ^7.0.0
  built_collection: ^5.1.1
  built_value: ^8.4.0
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  materyalph_api_client:
    path: ../../packages/api-contract/generated/dart
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  lucide_icons_flutter: ^3.1.20
  flutter_markdown_plus: ^1.0.12
  google_maps_flutter: ^2.18.2
  geolocator: ^14.1.1
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  web_socket_channel: ^3.0.3
  cached_network_image: ^4.0.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  firebase_messaging: ^16.7.0

flutter:

  uses-material-design: true
  assets:
    - assets/states/
    - assets/branding/
    - assets/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
