name: materyalph-vps

x-runtime: &runtime
  image: ${VPS_API_IMAGE:?Select an accepted API image by sha256 digest}
  env_file:
    - path: ${VPS_API_ENV_FILE:?Select the private staging API environment file}
      format: raw
  environment: &api-environment
    APP_ENV: staging
    APP_DEBUG: "false"
    XENDIT_MODE: TEST
    LIVE_COMMERCE_ENABLED: "false"
    FREE_STAGING_PREVIEW: "false"
    RUN_QUEUE: "false"
    RUN_SCHEDULER: "false"
    RUN_FRESHCLAM: "false"
    VPS_RUNTIME: "true"
    DEPLOYMENT_STANDBY: "false"
    PORT: "10000"
    VPS_DEPLOY_COMMIT: ${VPS_DEPLOY_COMMIT:?Select the accepted source commit}
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [data, egress]
  logging: &logs
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: postgis/postgis:16-3.5
    entrypoint: [/bin/sh, /opt/materyalph/postgres-entrypoint.sh]
    environment:
      POSTGRES_DB: materyalph_staging
      POSTGRES_USER: materyalph_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/vps/init-database.sh:/docker-entrypoint-initdb.d/20-materyalph.sh:ro
      - ./infrastructure/vps/postgres-entrypoint.sh:/opt/materyalph/postgres-entrypoint.sh:ro
      - ${VPS_RECOVERY_DIRECTORY:?Set a private recovery directory}:/recovery:ro
    networks: [data]
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 1536m
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=60]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U materyalph_owner -d materyalph_staging]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logs

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    networks: [data]
    restart: unless-stopped
    mem_limit: 384m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logs

  api:
    <<: *runtime
    command: [/usr/local/bin/render-start, api]
    networks: [data, egress, edge]
    volumes: [runtime-state:/run/materyalph:ro]
    mem_limit: 2304m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:10000/up]
      interval: 10s
      timeout: 3s
      retries: 12
    cpus: 1.5

  worker:
    <<: *runtime
    profiles: [active]
    command: [/usr/local/bin/render-start, worker]
    mem_limit: 384m
    depends_on: {api: {condition: service_healthy}}

  scheduler:
    <<: *runtime
    profiles: [active]
    command: [/usr/local/bin/render-start, scheduler-loop]
    mem_limit: 384m
    depends_on: {api: {condition: service_healthy}}

  reverb:
    image: ${VPS_API_IMAGE:?Select the API image}
    env_file:
      - path: ${VPS_REVERB_ENV_FILE:?Select the private Reverb environment file}
        format: raw
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      PORT: "10000"
      REDIS_URL: redis://redis:6379
      FREE_STAGING_PREVIEW: "false"
    command: [/usr/local/bin/render-start, reverb]
    networks: [data, edge]
    restart: unless-stopped
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logs
    depends_on: {redis: {condition: service_healthy}}

  edge:
    image: ${VPS_EDGE_IMAGE:?Select an accepted portal image by sha256 digest}
    environment:
      API_HOST: ${VPS_API_HOST:?Reserve the API DuckDNS hostname}
      VENDOR_HOST: ${VPS_VENDOR_HOST:?Reserve the Vendor DuckDNS hostname}
      ADMIN_HOST: ${VPS_ADMIN_HOST:?Reserve the Admin DuckDNS hostname}
      REVERB_HOST: ${VPS_REVERB_HOST:?Reserve the WebSocket DuckDNS hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    networks: [edge]
    restart: unless-stopped
    mem_limit: 192m
    security_opt: [no-new-privileges:true]
    logging: *logs
    depends_on: {api: {condition: service_healthy}}

  release:
    <<: *runtime
    profiles: [ops]
    restart: "no"
    command: [/usr/local/bin/render-start, release]

  operator:
    <<: *runtime
    profiles: [ops]
    restart: "no"
    user: "0:0"
    command: [php, /app/infrastructure/vps-transfer.php, inspect, /recovery]
    volumes:
      - runtime-state:/run/materyalph
      - ${VPS_RECOVERY_DIRECTORY:?Set a private absolute recovery directory}:/recovery

  backup:
    image: restic/restic:0.18.1
    profiles: [ops]
    env_file:
      - path: ${VPS_BACKUP_ENV_FILE:?Select the private offsite backup environment file}
        format: raw
    environment: {RESTIC_PASSWORD_FILE: /run/secrets/backup_password}
    secrets: [backup_password]
    volumes: ["${VPS_RECOVERY_DIRECTORY:?Select the recovery directory}:/recovery"]
    networks: [egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logs

secrets:
  db_owner_password: {file: "${VPS_DB_OWNER_PASSWORD_FILE:?Select the owner password file}"}
  db_app_password: {file: "${VPS_DB_APP_PASSWORD_FILE:?Select the application password file}"}
  backup_password: {file: "${VPS_BACKUP_PASSWORD_FILE:?Select the backup password file}"}

networks:
  data: {internal: true}
  egress: {}
  edge:
    ipam: {config: [{subnet: 172.30.240.0/24}]}

volumes:
  postgres-data:
  redis-data:
  runtime-state:
  caddy-data:
  caddy-config:
