name: quality gates

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      contract: ${{ steps.paths.outputs.contract }}
      web: ${{ steps.paths.outputs.web }}
      mobile: ${{ steps.paths.outputs.mobile }}
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - id: paths
        run: node scripts/ci/changed-paths.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Laravel, PostgreSQL, and schema evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: materyalph_test
          POSTGRES_USER: materyalph_test_runner
          POSTGRES_PASSWORD: ci_phase1_test_password_32_chars_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materyalph_test_runner -d materyalph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: materyalph_test
      DB_USERNAME: materyalph_test_runner
      DB_PASSWORD: ci_phase1_test_password_32_chars_only
      TEST_DB_ALLOWED_HOSTS: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FINANCE_MODE: TEST
      WITHHOLDING_SCENARIO: NONE
      PLATFORM_TAX_PROFILE: NON_VAT
      LIVE_COMMERCE_ENABLED: false
      MATERIALS_ANALYTICS_ENABLED: false
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_pgsql, redis, sodium, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('services/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate and seed the exact PostgreSQL schema
        run: php artisan migrate:fresh --seed --force

      - name: Create ephemeral Passport signing keys
        run: php artisan passport:keys --force

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run backend tests
        run: php artisan test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Check API contracts against Laravel routes
        run: |
          npm ci --prefix ../../packages/api-contract
          php artisan route:list --json --path=api/v1 > /tmp/materyalph-routes.json
          trap 'rm -f /tmp/materyalph-routes.json' EXIT
          cd ../../packages/api-contract
          npm run test:account-contract -- /tmp/materyalph-routes.json
          npm run test:vendor-contract -- /tmp/materyalph-routes.json
          npm run test:catalog-contract -- /tmp/materyalph-routes.json
          npm run test:inventory-contract -- /tmp/materyalph-routes.json
          npm run test:geography-contract -- /tmp/materyalph-routes.json
          npm run test:procurement-contract -- /tmp/materyalph-routes.json
          npm run test:orders-contract -- /tmp/materyalph-routes.json
          npm run test:messaging-contract -- /tmp/materyalph-routes.json
          npm run test:projects-contract -- /tmp/materyalph-routes.json
          npm run test:payments-contract -- /tmp/materyalph-routes.json
          npm run test:fulfillment-contract -- /tmp/materyalph-routes.json
          npm run test:disputes-contract -- /tmp/materyalph-routes.json
          npm run test:trust-contract -- /tmp/materyalph-routes.json
          npm run test:notifications-contract -- /tmp/materyalph-routes.json
          npm run test:admin-operations-contract -- /tmp/materyalph-routes.json

      - name: Generate schema-derived architecture evidence
        run: php artisan materyalph:schema-document

      - name: Upload schema documentation evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: schema-documentation-${{ github.sha }}
          path: |
            docs/architecture/erd.md
            docs/architecture/data-dictionary.md
          if-no-files-found: error

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    name: OpenAPI and generated clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/api-contract/package-lock.json

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install contract tooling
        working-directory: packages/api-contract
        run: npm ci

      - name: Validate and regenerate clients
        working-directory: packages/api-contract
        run: |
          npm run validate
          npm run generate

      - name: Build TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Build Dart serializers and analyze
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build
          dart analyze --no-fatal-warnings

      - name: Reject generated-client drift
        run: git diff --exit-code -- packages/api-contract/generated

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: ${{ matrix.portal }} portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [vendor-web, admin-web]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/api-contract/generated/typescript/package-lock.json
            packages/web-ui/package-lock.json
            apps/${{ matrix.portal }}/package-lock.json

      - name: Build generated TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Install shared UI dependencies
        working-directory: packages/web-ui
        run: npm ci

      - name: Install portal dependencies
        working-directory: apps/${{ matrix.portal }}
        run: npm ci

      - name: Run portal gates
        working-directory: apps/${{ matrix.portal }}
        run: |
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build

  vendor-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Vendor and Admin responsive browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/api-contract/generated/typescript/package-lock.json
            packages/web-ui/package-lock.json
            apps/vendor-web/package-lock.json

      - name: Build generated TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Install shared UI dependencies
        working-directory: packages/web-ui
        run: npm ci

      - name: Install Vendor dependencies
        working-directory: apps/vendor-web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/vendor-web
        run: npx playwright install --with-deps chromium

      - name: Install and build Admin preview
        working-directory: apps/admin-web
        run: |
          npm ci
          npm run build

      - name: Build and run eight-viewport browser checks
        working-directory: apps/vendor-web
        run: |
          npm run build
          npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vendor-browser-${{ github.sha }}
          path: |
            apps/vendor-web/playwright-report
            apps/vendor-web/test-results
          if-no-files-found: ignore

  buyer-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Flutter Buyer app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build generated Dart serializers
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build

      - name: Install Buyer dependencies
        working-directory: apps/buyer-mobile
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed apps/buyer-mobile/lib apps/buyer-mobile/test

      - name: Analyze and test Buyer app
        working-directory: apps/buyer-mobile
        run: |
          flutter analyze
          flutter test

  buyer-ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Flutter Buyer iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build generated Dart serializers
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build

      - name: Install, test, and build Buyer iOS
        working-directory: apps/buyer-mobile
        run: |
          flutter pub get
          flutter test
          flutter build ios --simulator --no-codesign

  repository-safety:
    name: Tokens and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install the open-source secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan the repository history with redacted findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner'

  dependency-audit:
    name: PHP and JavaScript dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: composer audit --locked --no-interaction
        working-directory: services/api
      - name: Audit every JavaScript lockfile
        run: |
          for directory in packages/api-contract packages/api-contract/generated/typescript packages/web-ui apps/vendor-web apps/admin-web; do
            npm audit --prefix "$directory" --audit-level=high
          done

  infrastructure:
    name: Staging configuration and container
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/deployment/requirements.txt
      - run: python tools/deployment/validate_configuration.py
      - run: node --check scripts/deployment/deploy-render-staging.mjs && node --check scripts/ci/changed-paths.mjs
      - run: docker compose -f compose.test.yaml config --quiet
      - run: docker build --pull -f infrastructure/docker/api.render.Dockerfile -t materyalph-api:${{ github.sha }} .
      - name: Check the non-root runtime and server configuration
        run: |
          test "$(docker image inspect materyalph-api:${{ github.sha }} --format '{{.Config.User}}')" = app
          docker run --rm --env FRONTEND_VENDOR_HOST=vendor.example.test --env FRONTEND_ADMIN_HOST=admin.example.test --entrypoint /bin/sh materyalph-api:${{ github.sha }} -c 'php /app/infrastructure/prepare-nginx.php && php-fpm -t && nginx -t -c /app/infrastructure/nginx.conf'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: materyalph-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          hide-progress: true

  ci-success:
    name: All required checks passed
    if: always()
    needs: [changes, backend, contract, web, vendor-browser, buyer-mobile, buyer-ios, repository-safety, dependency-audit, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failures and canceled checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const checks=JSON.parse(process.env.CHECK_RESULTS); for (const [name,check] of Object.entries(checks)) { if (!["success","skipped"].includes(check.result)) { console.error(`${name}: ${check.result}`); process.exitCode=1 } }'

  deploy-staging:
    name: Deploy the tested staging commit
    needs: ci-success
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request' && vars.RENDER_STAGING_CONFIGURED == 'true'
    environment: staging
    concurrency:
      group: render-staging-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Deploy and verify the exact passing commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ vars.RENDER_STAGING_WORKSPACE_ID }}
          RENDER_STAGING_SERVICE_IDS: ${{ vars.RENDER_STAGING_SERVICE_IDS }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_VENDOR_URL: ${{ vars.STAGING_VENDOR_URL }}
          STAGING_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: node scripts/deployment/deploy-render-staging.mjs
