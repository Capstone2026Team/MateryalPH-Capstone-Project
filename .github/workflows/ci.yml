name: quality gates

# Staging releases remain disabled until the protected environment is configured.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Match the SDK recorded by the Buyer project's .metadata revision.
  FLUTTER_VERSION: '3.47.3'
  DART_VERSION: '3.13.3'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      contract: ${{ steps.paths.outputs.contract }}
      web: ${{ steps.paths.outputs.web }}
      mobile: ${{ steps.paths.outputs.mobile }}
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - id: paths
        run: node scripts/ci/changed-paths.mjs

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Laravel, PostgreSQL, and schema evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: materyalph_test
          POSTGRES_USER: materyalph_test_runner
          POSTGRES_PASSWORD: ci_phase1_test_password_32_chars_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U materyalph_test_runner -d materyalph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: materyalph_test
      DB_USERNAME: materyalph_test_runner
      DB_PASSWORD: ci_phase1_test_password_32_chars_only
      TEST_DB_ALLOWED_HOSTS: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REDIS_URL: redis://127.0.0.1:6379
      FINANCE_MODE: TEST
      WITHHOLDING_SCENARIO: NONE
      PLATFORM_TAX_PROFILE: NON_VAT
      LIVE_COMMERCE_ENABLED: false
      MATERIALS_ANALYTICS_ENABLED: false
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pcntl, pdo_pgsql, redis, sodium, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('services/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate and seed the exact PostgreSQL schema
        run: php artisan migrate:fresh --seed --force

      - name: Create ephemeral Passport signing keys
        run: php artisan passport:keys --force

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run backend tests
        run: php artisan test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Check API contracts against Laravel routes
        run: |
          npm ci --prefix ../../packages/api-contract
          php artisan route:list --json --path=api/v1 > /tmp/materyalph-routes.json
          trap 'rm -f /tmp/materyalph-routes.json' EXIT
          cd ../../packages/api-contract
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { scripts } = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const [name, command] of Object.entries(scripts)) {
            if (!/^test:.*-contract$/.test(name) || !command.startsWith('node ')) continue;
            const result = spawnSync('npm', ['run', name, '--', '/tmp/materyalph-routes.json'], { stdio: 'inherit' });
            if (result.error || result.status !== 0) process.exitCode = 1;
          }
          NODE

      - name: Generate schema-derived architecture evidence
        run: php artisan materyalph:schema-document

      - name: Upload schema documentation evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: schema-documentation-${{ github.sha }}
          path: |
            docs/architecture/erd.md
            docs/architecture/data-dictionary.md
          if-no-files-found: error

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    name: OpenAPI and generated clients
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/api-contract/package-lock.json

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Install contract tooling
        working-directory: packages/api-contract
        run: npm ci

      - name: Validate and regenerate clients
        working-directory: packages/api-contract
        run: |
          npm run validate
          npm run generate

      - name: Build TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Build Dart serializers and analyze
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build
          dart analyze --no-fatal-warnings

      - name: Run current Dart contract checks
        working-directory: packages/api-contract
        run: |
          dart pub get
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { scripts } = JSON.parse(readFileSync('package.json', 'utf8'));
          for (const [name, command] of Object.entries(scripts)) {
            if (!/^test:.*-contract$/.test(name) || !command.startsWith('dart ')) continue;
            const result = spawnSync('npm', ['run', name], { stdio: 'inherit' });
            if (result.error || result.status !== 0) process.exitCode = 1;
          }
          NODE

      - name: Reject generated-client drift
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync } from 'node:fs';

          // OpenAPI Generator can reorder independent primitive-union guards
          // across JVMs. Compare their canonical order without changing files.
          function canonical(contents, path) {
            const text = contents.replaceAll('\r\n', '\n');
            if (!path.endsWith('.ts')) return text;
            const groups = /(?:^    if \(typeof (?:json|value) === '(?:string|number|boolean)'\) \{\n        return (?:json|value);\n    \}\n){2,}/gm;
            return text.replace(groups, group => {
              const guards = [...group.matchAll(/^    if \(typeof (json|value) === '(string|number|boolean)'\) \{\n        return \1;\n    \}\n/gm)];
              if (guards.map(guard => guard[0]).join('') !== group
                || new Set(guards.map(guard => guard[1])).size !== 1
                || new Set(guards.map(guard => guard[2])).size !== guards.length) return group;
              return guards.map(guard => guard[0]).sort().join('');
            });
          }

          const root = 'packages/api-contract/generated';
          const paths = args => execFileSync('git', args, { encoding: 'utf8' }).split('\0').filter(Boolean);
          const changed = paths(['diff', '--name-only', '-z', '--', root]);
          const added = paths(['ls-files', '--others', '--exclude-standard', '-z', '--', root]);
          let failed = false;
          for (const path of [...new Set([...changed, ...added])]) {
            if (!added.includes(path) && existsSync(path)) {
              const committed = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' });
              if (canonical(committed, path) === canonical(readFileSync(path, 'utf8'), path)) continue;
            }
            console.error(`Generated-client drift: ${path}`);
            failed = true;
          }
          if (failed) {
            console.error('Regenerate and commit the API clients, including Dart serializers.');
            process.exitCode = 1;
          }
          NODE

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: ${{ matrix.portal }} portal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        portal: [vendor-web, admin-web]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/api-contract/generated/typescript/package-lock.json
            packages/web-ui/package-lock.json
            apps/${{ matrix.portal }}/package-lock.json

      - name: Build generated TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Install shared UI dependencies
        working-directory: packages/web-ui
        run: npm ci

      - name: Install portal dependencies
        id: portal_dependencies
        working-directory: apps/${{ matrix.portal }}
        run: npm ci

      - name: Lint portal
        working-directory: apps/${{ matrix.portal }}
        run: npm run lint

      - name: Typecheck portal
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        working-directory: apps/${{ matrix.portal }}
        run: npm run typecheck

      - name: Test portal
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        working-directory: apps/${{ matrix.portal }}
        run: npm run test -- --run

      - name: Build portal
        if: ${{ !cancelled() && steps.portal_dependencies.outcome == 'success' }}
        working-directory: apps/${{ matrix.portal }}
        run: npm run build

  vendor-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Vendor and Admin responsive browser QA (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/api-contract/generated/typescript/package-lock.json
            packages/web-ui/package-lock.json
            apps/vendor-web/package-lock.json
            apps/admin-web/package-lock.json

      - name: Build generated TypeScript client
        working-directory: packages/api-contract/generated/typescript
        run: |
          npm ci
          npm run build

      - name: Install shared UI dependencies
        working-directory: packages/web-ui
        run: npm ci

      - name: Install Vendor dependencies
        working-directory: apps/vendor-web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/vendor-web
        run: npx playwright install --with-deps chromium

      - name: Install and build Admin preview
        working-directory: apps/admin-web
        run: |
          npm ci
          npm run build

      - name: Build and run eight-viewport browser checks
        working-directory: apps/vendor-web
        run: |
          npm run build
          npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vendor-browser-${{ matrix.shard }}-${{ github.sha }}
          path: |
            apps/vendor-web/playwright-report
            apps/vendor-web/test-results
          if-no-files-found: ignore

  buyer-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Flutter Buyer app
    # The committed screenshot baselines are produced in the Windows workspace.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build generated Dart serializers
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build

      - name: Install Buyer dependencies
        id: buyer_dependencies
        working-directory: apps/buyer-mobile
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed apps/buyer-mobile/lib apps/buyer-mobile/test

      - name: Analyze Buyer app
        if: ${{ !cancelled() && steps.buyer_dependencies.outcome == 'success' }}
        working-directory: apps/buyer-mobile
        run: flutter analyze

      - name: Test Buyer app
        if: ${{ !cancelled() && steps.buyer_dependencies.outcome == 'success' }}
        working-directory: apps/buyer-mobile
        run: flutter test

  buyer-ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    name: Flutter Buyer iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build generated Dart serializers
        working-directory: packages/api-contract/generated/dart
        run: |
          dart pub get
          dart run build_runner build

      - name: Install Buyer iOS dependencies
        working-directory: apps/buyer-mobile
        run: flutter pub get

      # The full test suite runs in buyer-mobile; this job proves the iOS build.
      - name: Build Buyer iOS simulator
        working-directory: apps/buyer-mobile
        run: flutter build ios --simulator --no-codesign

  repository-safety:
    name: Tokens and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install the open-source secret scanner
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan the repository history with redacted findings
        run: |
          if ! "$RUNNER_TEMP/gitleaks" git --log-opts='--no-textconv --no-ext-diff' --redact --no-banner --report-format json --report-path "$RUNNER_TEMP/gitleaks.json"; then
            node -e 'for (const item of JSON.parse(require("node:fs").readFileSync(`${process.env.RUNNER_TEMP}/gitleaks.json`, "utf8"))) console.error(JSON.stringify({rule:item.RuleID,file:item.File,line:item.StartLine,fingerprint:item.Fingerprint}))'
            exit 1
          fi

  dependency-audit:
    name: PHP and JavaScript dependency audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: composer audit --locked --no-interaction
        working-directory: services/api
      - name: Audit every JavaScript lockfile
        run: |
          for directory in packages/api-contract packages/api-contract/generated/typescript packages/web-ui apps/vendor-web apps/admin-web; do
            npm audit --prefix "$directory" --audit-level=high
          done

  infrastructure:
    name: Staging configuration and container
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/deployment/requirements.txt
      - run: python tools/deployment/validate_configuration.py
      - run: python tools/deployment/validate_railway.py --online
      - run: node --test scripts/deployment/staging-deployment.test.mjs
      - run: sh -n infrastructure/docker/install-phpredis.sh && sh scripts/deployment/test-phpredis-installer.sh
      - run: sh -n infrastructure/docker/staging-start.sh && sh -n infrastructure/docker/redis-start.sh
      - run: node --check scripts/deployment/deploy-render-staging.mjs && node --check scripts/ci/changed-paths.mjs
      - name: Validate the isolated Compose file with ephemeral CI settings
        shell: bash
        run: |
          test ! -e services/api/.env.testing
          trap 'rm -f services/api/.env.testing' EXIT
          node -e 'require("node:fs").writeFileSync("services/api/.env.testing", `TEST_DB_PASSWORD=${require("node:crypto").randomBytes(32).toString("hex")}\n`)'
          docker compose --env-file services/api/.env.testing -f compose.test.yaml config --quiet
      - run: docker build --pull -f infrastructure/docker/api.staging.Dockerfile -t materyalph-api:${{ github.sha }} .
      - run: docker build --pull -f infrastructure/docker/postgres.railway.Dockerfile -t materyalph-postgres:${{ github.sha }} .
      - run: docker build --pull -f infrastructure/docker/redis.railway.Dockerfile -t materyalph-redis:${{ github.sha }} .
      - name: Exercise synthetic import, TLS, role privileges and Redis configuration
        run: |
          docker tag materyalph-api:${{ github.sha }} materyalph-api:railway-review
          docker tag materyalph-postgres:${{ github.sha }} materyalph-postgres:railway-review
          docker tag materyalph-redis:${{ github.sha }} materyalph-redis:railway-review
          python scripts/deployment/test-staging-runtime.py
      - name: Check the non-root runtime and server configuration
        run: |
          test "$(docker image inspect materyalph-api:${{ github.sha }} --format '{{.Config.User}}')" = app
          docker run --rm --env FRONTEND_VENDOR_HOST=vendor.example.test --env FRONTEND_ADMIN_HOST=admin.example.test --entrypoint /bin/sh materyalph-api:${{ github.sha }} -c 'php /app/infrastructure/prepare-nginx.php && php-fpm -t && nginx -e /dev/null -t -c /app/infrastructure/nginx.conf'
          if docker run --rm --env APP_ENV=staging --env XENDIT_MODE=TEST --env LIVE_COMMERCE_ENABLED=false materyalph-api:${{ github.sha }} /usr/local/bin/staging-start release; then
            echo 'Unapproved release unexpectedly succeeded'; exit 1
          fi
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: materyalph-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          hide-progress: true

  ci-success:
    name: All required checks passed
    if: always()
    needs: [changes, backend, contract, web, vendor-browser, buyer-mobile, buyer-ios, repository-safety, dependency-audit, infrastructure]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failures and canceled checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const checks=JSON.parse(process.env.CHECK_RESULTS); for (const [name,check] of Object.entries(checks)) { if (!["success","skipped"].includes(check.result)) { console.error(`${name}: ${check.result}`); process.exitCode=1 } }'

  staging-release:
    name: Deploy Railway and publish compiled Vercel portals
    needs: ci-success
    if: github.ref == 'refs/heads/staging' && github.event_name != 'pull_request' && vars.RAILWAY_STAGING_CONFIGURED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: staging
    concurrency:
      group: railway-vercel-staging-release
      cancel-in-progress: false
    env:
      DEPLOY_COMMIT: ${{ github.sha }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_STAGING_SERVICE_IDS: ${{ vars.RAILWAY_STAGING_SERVICE_IDS }}
      RAILWAY_API_ORIGIN: ${{ vars.RAILWAY_API_ORIGIN }}
      PORTAL_DEPLOY_OWNER: ${{ vars.PORTAL_DEPLOY_OWNER }}
      PORTAL_RELEASE_DIRECTORY: ${{ github.workspace }}/.tmp/portal-release
      VITE_API_BASE_URL: /api/v1
      RAILWAY_CLI_VERSION: ${{ vars.RAILWAY_CLI_VERSION }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install the reviewed Railway CLI version
        run: |
          [[ "$RAILWAY_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      - run: sh scripts/deployment/build-portal.sh vendor-web
      - run: sh scripts/deployment/build-portal.sh admin-web
      - run: node scripts/deployment/prepare-portals.mjs
      - name: Deploy only the four application roles
        run: node scripts/deployment/deploy-railway-staging.mjs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      - name: Publish tested artifacts to the private personal deployment repository
        run: node scripts/deployment/publish-portals.mjs
        env:
          PORTAL_PUBLISH_TOKEN: ${{ secrets.PORTAL_PUBLISH_TOKEN }}
